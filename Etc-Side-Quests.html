<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0824">
  <title>บทเรียนอื่นๆ · Side Quests | KruKan.in.th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Kanit:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0a0824;--paper:#f4f7ff;--cyan:#4ef4d2;--sun:#ffd34f;--c:#06b6d4;--hud:'Orbitron','Chakra Petch',sans-serif;--cut:12px}
    *{box-sizing:border-box}
    html{background:var(--ink)}
    body{margin:0;min-width:280px;color:var(--paper);font:400 15px/1.5 'Kanit',sans-serif;background:transparent;overflow-x:hidden}
    a,button,input{font:inherit;color:inherit}
    :where(a,button,input):focus-visible{outline:3px solid var(--sun);outline-offset:3px}

    /* ===== backdrop ===== */
    .space{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
      radial-gradient(ellipse 50% 45% at 6% 10%,#7c3aed66,transparent 70%),
      radial-gradient(ellipse 45% 40% at 96% 90%,#1e6fd966,transparent 70%),
      radial-gradient(ellipse 35% 35% at 92% 8%,#db277755,transparent 70%),
      radial-gradient(ellipse 35% 30% at 10% 95%,#0891b244,transparent 70%),
      linear-gradient(180deg,#0e0b30,#0a0824 50%,#080d26)}
    .stars,.stars::after{position:absolute;inset:-50%;background-image:
      radial-gradient(1px 1px at 23px 41px,#fff,transparent),radial-gradient(1px 1px at 87px 113px,#fffc,transparent),
      radial-gradient(1.5px 1.5px at 151px 29px,#cfe8ff,transparent),radial-gradient(1px 1px at 199px 171px,#fff9,transparent),
      radial-gradient(1px 1px at 61px 197px,#fff,transparent),radial-gradient(1.5px 1.5px at 131px 151px,#ffe9c9,transparent),
      radial-gradient(1px 1px at 173px 83px,#fffa,transparent),radial-gradient(1px 1px at 109px 63px,#fff9,transparent);background-size:180px 180px}
    .stars{animation:drift 160s linear infinite}
    .stars::after{content:'';inset:0;background-size:290px 290px;opacity:.7;animation:twinkle 4s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate(180px,90px)}}
    @keyframes twinkle{from{opacity:.25}to{opacity:.8}}

    .page{max-width:1180px;margin:0 auto;padding:16px 16px 20px}

    /* ===== header ===== */
    .crumbs{font-size:12px;color:#b9c4dc}
    .crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
    .hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-top:6px}
    h1{margin:0;font:700 clamp(26px,5vw,40px)/1.1 'Kanit',sans-serif;text-shadow:0 2px 18px rgba(124,58,237,.6)}
    h1 small{display:block;margin-top:6px;font:800 12px/1 var(--hud);letter-spacing:.24em;color:var(--cyan)}
    .stats{display:flex;gap:8px;flex-wrap:wrap}
    .stat{padding:6px 14px;text-align:center;background:rgba(10,14,34,.6);border:1px solid rgba(255,255,255,.18);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
    .stat b{display:block;font:800 20px/1.2 var(--hud);color:var(--sun)}
    .stat span{font-size:11px;color:#b9c4dc}

    /* ===== controls ===== */
    .bar{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 10px}
    .search{flex:1 1 240px;display:flex;align-items:center;gap:8px;padding:0 14px;height:44px;background:rgba(10,14,34,.7);border:1px solid rgba(255,255,255,.22);border-radius:999px}
    .search input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font-size:15px}
    .search input::placeholder{color:#8f9bb8}
    .search:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(78,244,210,.2)}
    .dice{height:44px;padding:0 18px;white-space:nowrap;border:0;cursor:pointer;font-weight:600;color:#1a1200;background:linear-gradient(120deg,#fff3b0,var(--sun));border-radius:999px;transition:transform .15s,filter .15s}
    .dice:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{--c:#06b6d4;padding:6px 14px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);background:rgba(10,14,34,.6);border-radius:999px;cursor:pointer;font-size:13.5px;transition:background .15s,transform .15s}
    .chip:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--c) 22%,rgba(10,14,34,.6))}
    .chip[aria-pressed="true"]{background:linear-gradient(120deg,color-mix(in srgb,var(--c) 85%,#fff 15%),var(--c));border-color:transparent;color:#07101a;font-weight:600}
    .chip em{font-style:normal;margin-left:4px;opacity:.75;font-size:12px}

    /* ===== grid ===== */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(222px,1fr));gap:12px;margin-top:14px}
    .card{--c:#06b6d4;position:relative;display:flex;align-items:center;gap:12px;min-height:76px;padding:12px 14px 12px 12px;text-decoration:none;isolation:isolate;
      background:linear-gradient(120deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));
      clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
      transition:transform .18s,filter .18s;animation:rise .4s both}
    .card::before{content:'';position:absolute;inset:2px;z-index:-1;clip-path:inherit;
      background:radial-gradient(ellipse at 15% 0,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%),
      linear-gradient(120deg,color-mix(in srgb,var(--c) 26%,#0b0f28),color-mix(in srgb,var(--c) 10%,#0b0f28))}
    .card:hover{transform:translateY(-3px);filter:brightness(1.15) drop-shadow(0 8px 14px rgba(0,0,0,.5))}
    .card[hidden]{display:none}
    .ico{flex:none;width:44px;height:48px;display:grid;place-items:center;font-size:23px;
      background:linear-gradient(160deg,#fff,var(--c));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
    .txt{min-width:0;flex:1}
    .txt b{display:block;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
    .txt small{display:block;margin-top:2px;font-size:11.5px;color:color-mix(in srgb,var(--c) 55%,#fff)}
    .go{flex:none;font-size:18px;opacity:.7;transition:transform .18s,opacity .18s}
    .card:hover .go{transform:translateX(3px);opacity:1}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}}
    .empty{display:none;margin:30px 0;text-align:center;color:#b9c4dc}
    .empty.show{display:block}

    footer{margin-top:22px;text-align:center;font-size:12.5px;color:#b9c4dc}
    footer a{color:#dfe7f3}
    .ai-note{margin:8px auto 0}
    .ai-btn{padding:4px 14px;color:#dfe7f3;background:rgba(10,14,34,.6);border:1px solid rgba(255,255,255,.22);border-radius:999px;font:500 12px/1.5 'Kanit',sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
    .ai-btn:hover{border-color:rgba(255,255,255,.55);background:rgba(10,14,34,.85)}
    .swal2-popup.ai-popup{font-family:'Kanit',sans-serif;border:1px solid rgba(255,255,255,.18);border-radius:18px}
    .ai-popup .swal2-title{font-size:20px}
    .ai-popup .ai-body{text-align:left;font-size:14px;line-height:1.65;color:#c9d4e3}
    .ai-popup dl{margin:0}.ai-popup dt{margin-top:10px;color:#fff;font-weight:600}.ai-popup dd{margin:2px 0 0}.ai-popup ul{margin:2px 0 0;padding-left:20px}
    .ai-popup b{color:#fff}
    .ai-popup .ai-ok{color:#04120f!important;font-weight:600;font-family:inherit}
    .ai-fallback{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(3,4,12,.72);padding:16px}
    .ai-fallback .ai-popup{max-width:640px;background:#0b0f28;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:20px;color:#e9f2ff}
    .ai-fallback button{margin-top:14px;padding:8px 22px;border:0;border-radius:8px;background:#4ef4d2;color:#04120f;font-weight:600;cursor:pointer}

    @media(max-width:520px){
      .page{padding:12px 12px 16px}
      .grid{grid-template-columns:1fr 1fr;gap:8px}
      .card{flex-direction:column;align-items:flex-start;gap:8px;padding:10px}
      .go{display:none}
      .ico{width:38px;height:42px;font-size:20px}
      .txt b{font-size:14px}
      .dice{flex:1}
    }
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="space" aria-hidden="true"><div class="stars"></div></div>

  <div class="page">
    <nav class="crumbs" aria-label="breadcrumb"><a href="https://www.krukan.in.th/home" target="_blank" rel="noopener">หน้าแรก</a> › บทเรียนอื่นๆ</nav>

    <header class="hero">
      <h1>บทเรียนอื่นๆ <span style="color:var(--cyan)">·</span> ภารกิจเสริม<small>SIDE QUESTS · เกมและกิจกรรมทั้งหมด</small></h1>
      <div class="stats" aria-label="สรุป">
        <div class="stat"><b id="n-total">0</b><span>ภารกิจ</span></div>
        <div class="stat"><b id="n-cats">0</b><span>หมวด</span></div>
      </div>
    </header>

    <div class="bar">
      <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="ค้นหาเกม หรือบทเรียน…" autocomplete="off" aria-label="ค้นหา"></label>
      <button class="dice" id="dice" type="button">🎲 สุ่มภารกิจ</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="หมวดหมู่"></div>

    <main class="grid" id="grid"></main>
    <p class="empty" id="empty">ไม่พบภารกิจที่ค้นหา ลองเปลี่ยนคำหรือเลือกหมวดอื่นดูนะ 🛰️</p>

    <footer>KruKan.in.th · อัปเดตล่าสุด <time id="updated"></time> ·
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license noopener noreferrer">CC BY-NC-SA 4.0</a>
      <div class="ai-note"><button class="ai-btn" type="button" id="ai-btn">🤖 การใช้ AI · AI Disclosure</button></div>
      <template id="ai-note-tpl"><div class="ai-body"><dl>
        <dt>เครื่องมือ AI ที่ใช้</dt>
        <dd>Claude (Anthropic)</dd>
        <dt>ขอบเขตการใช้</dt>
        <dd><ul><li><b>Claude:</b> ช่วยเขียนและปรับแต่งโค้ด HTML/CSS/JavaScript ของหน้านี้</li></ul></dd>
        <dt>ระดับการช่วยเหลือ</dt>
        <dd>ผู้จัดทำเป็นผู้กำหนดแนวคิด เนื้อหา การจัดหมวดหมู่ และทิศทางการออกแบบทั้งหมด ใช้ AI เป็นเครื่องมือช่วยสร้างโค้ดเท่านั้น</dd>
      </dl></div></template>
    </footer>
  </div>

  <script>
    /* ===================== ตั้งค่าหน้านี้ ===================== */
    const SITE='https://www.krukan.in.th';
    const UPDATED='2026-10-10'; // ปี ค.ศ.-เดือน-วัน

    // หมวดหมู่
    const CATS={
      math:  {name:'คณิตศาสตร์',     emoji:'🔢', color:'#3b82f6'},
      thai:  {name:'ภาษาไทย',        emoji:'📖', color:'#f472b6'},
      eng:   {name:'English',        emoji:'🔤', color:'#22c55e'},
      code:  {name:'คอมพิวเตอร์·โค้ด', emoji:'💻', color:'#a78bfa'},
      techno:{name:'Techno ผจญภัย',  emoji:'🚀', color:'#06b6d4'},
      other: {name:'อื่นๆ',          emoji:'✨', color:'#facc15'}
    };

    // ภารกิจ: [ชื่อที่แสดง, path ใต้ /etc/, หมวด, อีโมจิ(ไม่ใส่ก็ได้)]
    // path ต้องตรงกับหน้าใน Google Sites ทุกตัวอักษร (ดู sitemap.md)
    const QUESTS=[
      ['ฝึกคิดเลขเร็ว','mathMix','math','⚡'],
      ['MathPlus','mathplus','math','➕'],
      ['สงครามตัวเลข','math2','math','⚔️'],
      ['เลขโรมัน','roman','math','🏛️'],
      ['เลขฐาน 2','base-number','math','💾'],
      ['เกมเรียงลำดับตัวเลข','sortnumber','math','🔀'],
      ['เกมสร้างเมืองนักคณิตศาสตร์','speedmath','math','🏙️'],
      ['นักล่าพลังบวก','marioplus','math','🍄'],
      ['ลบเลขกับเจ้ามอนสเตอร์','demox','math','👾'],
      ['คิดเลขแสนสนุก','funmath','math','🎈'],
      ['คู่ซี้บวกสิบ','plusto10','math','🔟'],
      ['บันไดงูการคูณ','koon','math','🐍'],
      ['บันไดงูบวกลบพหุนาม','sankeM1-1','math','🐍'],
      ['เกมเศษส่วนที่เท่ากัน','sankefaction','math','🍕'],
      ['บันไดงูบวกลบเลข','plussnake','math','🐍'],
      ['QuickMathMic','quickmathmic','math','🎤'],
      ['การประมาณ','pamarn','math','🎯'],
      ['เวลา','time','math','⏰'],
      ['ติว Onet ป.6','vvv','math','📝'],

      ['ก.ไก่','korkai','thai','🐔'],
      ['ฝึกอ่าน ก.ไก่','textthai','thai','🐔'],
      ['ฝึกอ่านภาษาไทย','readthai','thai','📖'],
      ['อ่านไทย อ.2','อานไทย-อ-2','thai','🔡'],
      ['อ่านไทยออกเสียง','speechthai','thai','🗣️'],

      ['WordFamily','wordfamily','eng','👪'],
      ['Reading Adventure','Reading-Adventure','eng','🗺️'],
      ['Reading2','reading2','eng','📚'],

      ['Python1','python1','code','🐍'],
      ['Flowchart','flowchart_1','code','🔀'],
      ['flowchart','flowchart','code','🔀'],
      ['การเขียนโปรแกรมแบบมีเงื่อนไข','การเขยนโปรแกรมแแบบมเงอนไข','code','🔧'],
      ['โครงงานคอมพิวเตอร์','kongngan','code','🧪'],
      ['ออกแบบ ม.1-2','M1-2-2','code','🎨'],
      ['ออกแบบ ม.1-3','M1-2-3','code','🎨'],
      ['information 3','information-3','code','🖥️'],

      ['TechnoRun','technorun','techno','🏃'],
      ['Techno-Story','techno-story','techno','📕'],
      ['TechnoMouse ฝึกใช้เมาส์','-TechnoMouseAdventure','techno','🖱️'],
      ['Techno Keyboard Quest','techno-keyboard-quest','techno','⌨️'],
      ['CyberGuardian','secreat','techno','🛡️'],
      ['หน่วยสืบสวนพลเมืองดิจิทัล','DIGITAL-CITIZEN-MISSION','techno','🕵️'],
      ['หนุมานพิชิตเส้นทาง','Hanuman','techno','🐒'],
      ['beat-hero','beat-hero','techno','🎵'],
      ['rainbow-city-techno','rainbow-city-techno','techno','🌈'],

      ['Smile4-1','smile4-1','other','😊'],
      ['M1-100269','m1-100269','other','📁'],
      ['หรม','หรม','other','📁']
    ];
    // ไม่นำมาแสดง (ลิงก์ยังเปิดไม่ได้ ตรวจเมื่อ 10 ต.ค. 2569): com2-2, p6new

    /* ===================== แสดงผล ===================== */
    const $=s=>document.querySelector(s);
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const url=p=>SITE+'/etc/'+encodeURI(p);
    let cat='all',term='';

    const counts={};QUESTS.forEach(q=>counts[q[2]]=(counts[q[2]]||0)+1);
    $('#n-total').textContent=QUESTS.length;
    $('#n-cats').textContent=Object.keys(counts).length;
    $('#updated').textContent=new Date(UPDATED+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});

    $('#chips').innerHTML=[['all','🌌','ทั้งหมด','#8b5cf6',QUESTS.length]].concat(
      Object.entries(CATS).filter(([k])=>counts[k]).map(([k,v])=>[k,v.emoji,v.name,v.color,counts[k]])
    ).map(([k,e,n,c,x])=>'<button type="button" class="chip" data-cat="'+k+'" style="--c:'+c+'" aria-pressed="'+(k==='all')+'">'+e+' '+esc(n)+'<em>'+x+'</em></button>').join('');

    $('#grid').innerHTML=QUESTS.map((q,i)=>{
      const c=CATS[q[2]];
      return '<a class="card" data-cat="'+q[2]+'" data-name="'+esc(q[0].toLowerCase())+'" style="--c:'+c.color+';animation-delay:'+Math.min(i,20)*25+'ms" href="'+url(q[1])+'" target="_blank" rel="noopener">'+
        '<span class="ico" aria-hidden="true">'+(q[3]||c.emoji)+'</span>'+
        '<span class="txt"><b>'+esc(q[0])+'</b><small>'+esc(c.name)+'</small></span><span class="go" aria-hidden="true">»</span></a>';
    }).join('');

    function apply(){
      let n=0;
      document.querySelectorAll('.card').forEach(el=>{
        const ok=(cat==='all'||el.dataset.cat===cat)&&(!term||el.dataset.name.includes(term));
        el.hidden=!ok;if(ok)n++;
      });
      $('#empty').classList.toggle('show',n===0);
    }
    $('#chips').addEventListener('click',e=>{
      const b=e.target.closest('.chip');if(!b)return;
      cat=b.dataset.cat;
      document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
      apply();
    });
    $('#q').addEventListener('input',e=>{term=e.target.value.trim().toLowerCase();apply()});
    $('#dice').addEventListener('click',()=>{
      const q=QUESTS[Math.floor(Math.random()*QUESTS.length)];
      window.open(url(q[1]),'_blank','noopener');
    });
  </script>
  <script>
    // AI Disclosure popup: SweetAlert2 is loaded only when the button is first clicked
    (()=>{
      const btn=document.getElementById('ai-btn'),tpl=document.getElementById('ai-note-tpl');
      if(!btn||!tpl)return;
      const title='🤖 การประกาศการใช้ปัญญาประดิษฐ์';
      const fallback=()=>{const o=document.createElement('div');o.className='ai-fallback';o.setAttribute('role','dialog');o.innerHTML='<div class="ai-popup"><h2 class="swal2-title">'+title+'</h2>'+tpl.innerHTML+'<button type="button">รับทราบ</button></div>';o.addEventListener('click',e=>{if(e.target===o||e.target.tagName==='BUTTON')o.remove()});document.body.appendChild(o);o.querySelector('button').focus()};
      const show=()=>Swal.fire({title,html:tpl.innerHTML,width:640,background:'#0b0f28',color:'#e9f2ff',confirmButtonText:'รับทราบ',confirmButtonColor:'#4ef4d2',customClass:{popup:'ai-popup',confirmButton:'ai-ok'},backdrop:'rgba(3,4,12,.72)',heightAuto:false,scrollbarPadding:false});
      let loading=null;
      btn.addEventListener('click',()=>{
        if(window.Swal)return show();
        loading=loading||new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
        loading.then(show).catch(()=>{loading=null;fallback()});
      });
    })();
  </script>
</body>
</html>
