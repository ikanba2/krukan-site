<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0824">
  <title>ประถมศึกษาปีที่ 1 · เลือกวิชา | KruKan.in.th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Kanit:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0a0824;--paper:#f4f7ff;--cyan:#4ef4d2;--sun:#ffd34f;--a:#06b6d4;--c:#06b6d4;--hud:'Orbitron','Chakra Petch',sans-serif;--tech:'Chakra Petch','Kanit',sans-serif;--hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);--planet:180px}
    *{box-sizing:border-box}
    html{background:var(--ink)}
    body{margin:0;min-width:280px;color:var(--paper);font:400 15px/1.5 'Kanit',sans-serif;background:transparent;overflow-x:hidden}
    a,button{font:inherit;color:inherit}
    :where(a,button):focus-visible{outline:3px solid var(--sun);outline-offset:3px}
    html.transparent,html.transparent body{background:transparent}
    html.transparent .space{display:none}

    /* ===== Galaxy backdrop ===== */
    .space{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
      radial-gradient(ellipse 55% 45% at 50% 50%,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%),
      radial-gradient(ellipse 50% 45% at 6% 12%,#7c3aed66,transparent 70%),
      radial-gradient(ellipse 45% 40% at 96% 92%,#1e6fd966,transparent 70%),
      radial-gradient(ellipse 35% 35% at 92% 8%,#db277755,transparent 70%),
      radial-gradient(ellipse 35% 30% at 10% 95%,#0891b244,transparent 70%),
      linear-gradient(115deg,transparent 30%,rgba(255,236,210,.05) 44%,rgba(200,180,255,.08) 50%,rgba(255,236,210,.05) 56%,transparent 70%),
      linear-gradient(180deg,#0e0b30,#0a0824 50%,#080d26)}
    .space::before{content:'';position:absolute;inset:0;background:radial-gradient(1200px 500px at 50% 50%,rgba(255,255,255,.03),transparent 70%);mix-blend-mode:screen}
    .stars,.stars::after{position:absolute;inset:-50%;background-image:
      radial-gradient(1px 1px at 23px 41px,#fff,transparent),radial-gradient(1px 1px at 87px 113px,#fffc,transparent),
      radial-gradient(1.5px 1.5px at 151px 29px,#cfe8ff,transparent),radial-gradient(1px 1px at 199px 171px,#fff9,transparent),
      radial-gradient(1px 1px at 61px 197px,#fff,transparent),radial-gradient(1.5px 1.5px at 131px 151px,#ffe9c9,transparent),
      radial-gradient(1px 1px at 173px 83px,#fffa,transparent),radial-gradient(1px 1px at 11px 131px,#fff8,transparent),
      radial-gradient(1px 1px at 109px 63px,#fff9,transparent);background-size:180px 180px}
    .stars{animation:drift 160s linear infinite;filter:drop-shadow(0 0 2px #fff)}
    .stars::after{content:'';inset:0;background-size:290px 290px;opacity:.7;animation:twinkle 4s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate(180px,90px)}}
    @keyframes twinkle{from{opacity:.25}to{opacity:.9}}

    .page{width:min(1100px,100%);margin:auto;padding:20px 24px 14px;overflow-x:hidden;overflow-x:clip}

    /* ===== Header ===== */
    .head{display:flex;align-items:center;gap:14px}
    .avatar{width:68px;height:76px;flex:none;display:grid;place-items:end center;overflow:hidden;clip-path:var(--hex);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--a) 55%,transparent),#0b1120 75%)}
    .avatar img{width:100%;height:auto;transform:translateY(8%)}
    .who{min-width:0;flex:1}
    .crumbs{display:flex;gap:6px;color:#7d8ca4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .crumbs a{color:#9fb0c6;text-decoration:none}
    .crumbs a:hover{color:var(--cyan)}
    .who h1{margin:2px 0 0;font:700 28px/1.25 var(--tech)}
    .who h1 small{margin-left:10px;color:color-mix(in srgb,var(--a) 70%,#fff);font:700 11px/1 var(--hud);letter-spacing:.16em;vertical-align:middle}
    .switch{display:flex;gap:3px;flex:none}
    .switch a{display:grid;place-items:center;width:44px;height:36px;color:#9fb0c6;text-decoration:none;background:rgba(255,255,255,.06);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);font:500 14px/1 'Kanit',sans-serif;transition:background .2s,color .2s}
    .switch a:hover{color:#fff;background:color-mix(in srgb,var(--sc) 35%,transparent)}
    .switch a[aria-current]{color:#04120f;font-weight:700;background:var(--sc)}

    /* ===== Orbit stage ===== */
    .galaxy{margin-top:6px}
    .stage{position:relative;height:330px;touch-action:pan-y;user-select:none;cursor:grab;outline:none}
    .stage.dragging{cursor:grabbing}
    .stage:focus-visible .orbit{border-color:var(--sun)}
    .orbit{position:absolute;border-radius:50%;border:1px dashed rgba(255,255,255,.16);pointer-events:none}
    .orbit::before{content:'';position:absolute;inset:-14px -40px;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 32%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--c) 20%,transparent),inset 0 0 40px color-mix(in srgb,var(--c) 10%,transparent);transition:border-color .5s,box-shadow .5s}
    .orbit::after{content:'';position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe9a8 25%,color-mix(in srgb,var(--c) 60%,transparent) 55%,transparent 72%);filter:blur(1px);opacity:.75}
    .body{position:absolute;left:0;top:0;width:calc(var(--planet)*1.7);height:calc(var(--planet) + 30px);padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;will-change:transform,opacity}
    .body>*{grid-area:1/1}
    .body.active{cursor:default}
    .tag{align-self:end;margin-bottom:-6px;padding:2px 9px;color:#c9d4e3;background:rgba(5,9,18,.7);font-size:13px;font-weight:500;white-space:nowrap;transition:opacity .3s}
    .body.active .tag{opacity:0}

    /* Planet */
    .halo{width:calc(var(--planet)*1.45);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pc) 45%,transparent),transparent 65%);opacity:.55}
    .body.active .halo{opacity:1;animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
    .ring{width:calc(var(--planet)*1.6);height:calc(var(--planet)*.4);border-radius:50%;border:3px solid color-mix(in srgb,var(--pc) 55%,#fff);box-shadow:0 0 14px color-mix(in srgb,var(--pc) 60%,transparent);transform:rotate(-16deg);opacity:.85}
    .ring.front{clip-path:inset(50% 0 0 0);z-index:2}
    .planet{position:relative;z-index:1;width:var(--planet);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border-radius:50%;color:#fff;background:radial-gradient(circle at 32% 28%,#ffffffd0 0,color-mix(in srgb,var(--pc) 55%,#fff) 9%,var(--pc) 38%,color-mix(in srgb,var(--pc) 45%,#000) 74%,#05040c 100%);box-shadow:0 0 40px color-mix(in srgb,var(--pc) 55%,transparent),inset -16px -18px 36px #000a}
    .planet::before{content:'';position:absolute;inset:-20%;border-radius:50%;background:repeating-linear-gradient(-16deg,transparent 0 14px,rgba(255,255,255,.12) 14px 20px,transparent 20px 34px,rgba(0,0,0,.14) 34px 42px);mix-blend-mode:overlay;animation:spinband 24s linear infinite}
    .planet::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 75%,transparent 40%,rgba(0,0,0,.45) 75%)}
    @keyframes spinband{to{background-position:240px 0}}
    .planet svg{position:relative;z-index:1;width:calc(var(--planet)*.3);height:calc(var(--planet)*.3);stroke-width:1.8;filter:drop-shadow(0 2px 6px #0009);opacity:.92}
    .moon{position:absolute;z-index:3;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa6bb 60%,#3a4255);box-shadow:0 0 8px #fff6;animation:moon 9s linear infinite}
    @keyframes moon{0%{transform:rotate(0) translateX(calc(var(--planet)*.74)) scale(.8)}50%{transform:rotate(180deg) translateX(calc(var(--planet)*.74)) scale(1.1)}100%{transform:rotate(360deg) translateX(calc(var(--planet)*.74)) scale(.8)}}
    .body:not(.active) .moon{display:none}
    .body.locked .planet{filter:grayscale(.75) brightness(.7)}
    .lock{position:absolute;z-index:4;right:24%;top:10%;width:30px;height:34px;display:grid;place-items:center;color:#1a0d00;background:var(--sun);clip-path:var(--hex)}
    .lock svg{width:15px;height:15px;stroke-width:2.6}

    .nav{position:absolute;z-index:200;width:48px;height:54px;display:grid;place-items:center;border:0;color:#fff;background:rgba(255,255,255,.08);clip-path:var(--hex);cursor:pointer;transform:translate(-50%,-50%);transition:background .2s}
    .nav:hover{background:color-mix(in srgb,var(--c) 50%,transparent)}
    .nav svg{width:20px;height:20px;stroke-width:2.6}

    /* Info of the selected subject */
    .info{display:flex;flex-direction:column;align-items:center;min-height:132px;text-align:center}
    .info.swap{animation:swap .4s ease}
    @keyframes swap{from{opacity:0;transform:translateY(8px)}}
    .info h2{margin:0;font:700 28px/1.25 var(--tech);text-shadow:0 2px 14px #000}
    .theme{margin:2px 0 0;color:var(--sun);font-size:14.5px}
    .meta{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin-top:2px;color:#9fb0c6;font-size:13.5px}
    .go{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;margin-top:12px;padding:0 28px 0 22px;color:#04120f;text-decoration:none;background:linear-gradient(100deg,#fff,var(--c));clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font:600 16px/1 'Kanit',sans-serif;white-space:nowrap;transition:filter .2s,transform .2s}
    .go svg{width:14px;height:14px;fill:currentColor}
    a.go:hover{filter:brightness(1.08) drop-shadow(0 0 12px var(--c));transform:translateY(-2px)}
    .go.soon{color:#c8d2e2;background:#2a3446;cursor:default}
    .go.soon svg{fill:none}

    .foot{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap}
    .dots{display:flex;gap:8px}
    .dot{width:12px;height:12px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--dc) 45%,#1a2030);cursor:pointer;transition:transform .3s,box-shadow .3s}
    .dot[aria-current="true"]{transform:scale(1.35);background:var(--dc);box-shadow:0 0 10px var(--dc)}
    .hint{margin:0;color:#b6c2d6;font-size:12.5px;text-shadow:0 1px 6px #0009}
    .counter{color:var(--cyan);font:700 11px/1 var(--hud);letter-spacing:.14em}

    footer{margin-top:12px;color:#b6c2d6;font-size:12px;text-align:center;text-shadow:0 1px 6px #0009}
    footer a{color:#dfe7f3}

    @media(max-width:760px){
      :root{--planet:128px}
      .page{padding:12px 12px 10px}
      .head{flex-wrap:wrap;gap:10px 12px}
      .avatar{width:56px;height:64px}
      .who h1{font-size:22px}
      .switch{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
      .switch::-webkit-scrollbar{display:none}
      .switch a{flex:0 0 48px;height:36px}
      .stage{height:250px}
      .nav{display:none}
      .tag{font-size:11.5px}
      .info{min-height:120px}
      .info h2{font-size:23px}
      .hint{display:none}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="space" aria-hidden="true"><div class="stars"></div></div>

  <div class="page">
    <header class="head">
      <span class="avatar" aria-hidden="true"><img id="stage-mascot" alt="" width="360" height="420"></span>
      <div class="who">
        <nav class="crumbs" aria-label="ตำแหน่งปัจจุบัน" id="crumbs"></nav>
        <h1 id="stage-title"></h1>
      </div>
      <nav class="switch" aria-label="เปลี่ยนชั้นเรียน" id="switch"></nav>
    </header>

    <section class="galaxy" aria-roledescription="carousel" aria-label="เลือกวิชา">
      <div class="stage" id="stage" tabindex="0" aria-label="วงโคจรรายวิชา ใช้ลูกศรซ้ายขวาเพื่อเลือก">
        <div class="orbit" id="orbit" aria-hidden="true"></div>
        <button class="nav" type="button" id="prev" aria-label="วิชาก่อนหน้า"><i data-lucide="chevron-left"></i></button>
        <button class="nav" type="button" id="next" aria-label="วิชาถัดไป"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="info" id="info" aria-live="polite"></div>
      <div class="foot">
        <span class="counter" id="counter" lang="en"></span>
        <div class="dots" id="dots" role="tablist" aria-label="เลือกวิชา"></div>
        <p class="hint">ลาก ปัด หรือกดลูกศร เพื่อหมุนวงโคจร</p>
      </div>
    </section>

    <footer>KruKan.in.th · อัปเดตล่าสุด <time id="updated"></time> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license noopener noreferrer">CC BY-NC-SA 4.0</a></footer>
  </div>

  <script>
    /* ===================== ตั้งค่าหน้านี้ ===================== */
    const SITE='https://www.krukan.in.th';
    const UPDATED='2026-10-10'; // ปี ค.ศ.-เดือน-วัน
    const TRANSPARENT_BG=false; // true = พื้นหลังโปร่งใส ให้กลืนกับพื้นหลังของส่วน (section) ใน Google Sites

    // ข้อมูลชั้นเรียน: เปลี่ยนตรงนี้เมื่อนำไปใช้กับชั้นอื่น
    const STAGE={
      code:'PRIMARY 1',
      short:'ป.1',
      name:'ประถมศึกษาปีที่ 1',
      color:'#06b6d4',
      mascot:'https://lh3.googleusercontent.com/d/13KExfpO-RBtatZOcX8NG7N5Sh4dGlQP_=w360',
      url:'/Class/Primary1'
    };

    // รายวิชา (แต่ละวิชา = ดาวเคราะห์ 1 ดวง): เพิ่มวิชาใหม่ได้โดยเพิ่ม { ... } ต่อท้าย
    // status: 'open' = เปิดเรียนแล้ว · 'soon' = ดาวสีจาง ติดป้ายล็อก "เร็ว ๆ นี้"
    // ring: true = ดาวมีวงแหวน
    const SUBJECTS=[
      {
        title:'วิทยาการคำนวณ', icon:'wand-sparkles', color:'#06b6d4', ring:true,
        theme:'แผนการเดินทางสู่จอมขมังเวทน้อย',
        meta:['9 บทเรียน','2 ภาคเรียน'],
        url:'https://sites.google.com/view/krukansite/Class/Primary1/P1-Technology-',
        status:'open'
      }
      ,{title:'คณิตศาสตร์', icon:'calculator', color:'#f59e0b', url:'', status:'soon'}
      ,{title:'ภาษาไทย', icon:'book-open-text', color:'#ec4899', ring:true, url:'', status:'soon'}
      ,{title:'ภาษาอังกฤษ', icon:'languages', color:'#8b5cf6', url:'', status:'soon'}
      // เมื่อวิชาไหนพร้อม: ใส่ url และเปลี่ยน status เป็น 'open'
    ];

    // ชั้นเรียนทั้งหมด (ปุ่มเปลี่ยนชั้น)
    const STAGES=[
      ['ป.1','/Class/Primary1','#06b6d4'],['ป.2','/Class/Primary2','#3b82f6'],['ป.3','/Class/Primary3','#14b8a6'],
      ['ป.4','/Class/Primary4','#f59e0b'],['ป.5','/Class/Primary5','#f97316'],['ป.6','/Class/Primary6','#eab308'],
      ['ม.1','/Class/Secondary1','#ec4899'],['ม.2','/Class/Secondary2','#8b5cf6'],['ม.3','/Class/Secondary3','#d946ef']
    ];
    /* ======================================================== */

    const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const link=p=>/^https?:/i.test(p)?p:SITE+p;
    const ext='target="_blank" rel="noopener noreferrer"';
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const root=document.documentElement;

    if(TRANSPARENT_BG)root.classList.add('transparent');
    root.style.setProperty('--a',STAGE.color);
    document.title=STAGE.name+' · เลือกวิชา | KruKan.in.th';
    $('#stage-mascot').src=STAGE.mascot;
    $('#crumbs').innerHTML='<a href="'+link('/home')+'" '+ext+'>หน้าแรก</a><span aria-hidden="true">›</span><a href="'+link('/Class')+'" '+ext+'>ห้องเรียน</a><span aria-hidden="true">›</span><span aria-current="page">'+esc(STAGE.short)+'</span>';
    $('#stage-title').innerHTML=esc(STAGE.name)+'<small lang="en">'+esc(STAGE.code)+'</small>';
    $('#switch').innerHTML=STAGES.map(([n,p,c])=>'<a style="--sc:'+c+'" href="'+link(p)+'" '+ext+(p===STAGE.url?' aria-current="page"':'')+'>'+n+'</a>').join('');

    /* ----- Planets ----- */
    const stage=$('#stage'),orbit=$('#orbit'),N=SUBJECTS.length;
    stage.insertAdjacentHTML('beforeend',SUBJECTS.map((s,i)=>{
      const locked=s.status==='soon';
      return '<button class="body'+(locked?' locked':'')+'" type="button" data-i="'+i+'" style="--pc:'+s.color+'" aria-label="'+esc(s.title)+(locked?' (เร็ว ๆ นี้)':'')+'">'+
        '<span class="halo"></span>'+(s.ring?'<span class="ring"></span>':'')+
        '<span class="planet"><i data-lucide="'+s.icon+'"></i></span>'+(s.ring?'<span class="ring front"></span>':'')+
        '<span class="moon"></span>'+(locked?'<span class="lock"><i data-lucide="lock"></i></span>':'')+
        '<span class="tag">'+esc(s.title)+'</span></button>';
    }).join(''));
    $('#dots').innerHTML=SUBJECTS.map((s,i)=>'<button class="dot" type="button" role="tab" style="--dc:'+s.color+'" data-i="'+i+'" aria-label="'+esc(s.title)+'"></button>').join('');
    const bodies=$$('.body'),dots=$$('.dot');

    /* ----- Orbit geometry ----- */
    let geo={cx:0,cy:0,rx:0,ry:0};
    function measure(){
      const w=stage.clientWidth,h=stage.clientHeight,mobile=w<560;
      geo.cx=w/2;
      geo.rx=Math.min(w*(mobile?.36:.34),380);
      geo.ry=mobile?34:58;
      geo.cy=h*(mobile?.42:.4);
      Object.assign(orbit.style,{left:(geo.cx-geo.rx)+'px',top:(geo.cy-geo.ry)+'px',width:geo.rx*2+'px',height:geo.ry*2+'px'});
      const navY=geo.cy+'px';
      Object.assign($('#prev').style,{left:Math.max(28,geo.cx-geo.rx-130)+'px',top:navY});
      Object.assign($('#next').style,{left:Math.min(w-28,geo.cx+geo.rx+130)+'px',top:navY});
    }
    const step=N>=3?2*Math.PI/N:(N===2?1.25:0);
    const wrap=d=>{d=((d%N)+N)%N;return d>N/2?d-N:d};

    let rot=0,active=-1,target=0;
    function render(){
      bodies.forEach((el,i)=>{
        const th=wrap(i-rot)*step;
        const depth=(Math.cos(th)+1)/2;
        const x=geo.cx+geo.rx*Math.sin(th),y=geo.cy+geo.ry*Math.cos(th);
        const s=.38+.62*Math.pow(depth,1.6);
        el.style.transform='translate('+(x-el.offsetWidth/2)+'px,'+(y-el.offsetHeight/2)+'px) scale('+s.toFixed(3)+')';
        el.style.opacity=(.35+.65*depth).toFixed(3);
        el.style.zIndex=String(Math.round(depth*100));
        el.style.filter=depth<.95?'saturate('+(.4+.6*depth).toFixed(2)+')':'';
      });
    }
    function setActive(i){
      if(i===active)return;
      active=i;
      const s=SUBJECTS[i],locked=s.status==='soon';
      bodies.forEach((el,k)=>{el.classList.toggle('active',k===i);el.setAttribute('aria-current',String(k===i))});
      dots.forEach((d,k)=>{d.setAttribute('aria-current',String(k===i));d.setAttribute('aria-selected',String(k===i))});
      root.style.setProperty('--c',s.color);
      $('#counter').textContent=String(i+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
      const info=$('#info');
      info.innerHTML='<h2>'+esc(s.title)+'</h2>'+
        (s.theme?'<p class="theme">✦ '+esc(s.theme)+'</p>':'')+
        (s.meta?'<div class="meta">'+s.meta.map(m=>'<span>'+esc(m)+'</span>').join('')+'</div>':'')+
        (locked?'<span class="go soon"><i data-lucide="lock"></i>เร็ว ๆ นี้</span>':'<a class="go" href="'+link(s.url)+'" '+ext+'><i data-lucide="play"></i>เข้าเรียน</a>');
      info.classList.remove('swap');void info.offsetWidth;info.classList.add('swap');
      icons();
    }

    /* ----- Animation: rotate along the arc (with a fallback if frames are throttled) ----- */
    let raf=0,fallback=0;
    function animate(){
      cancelAnimationFrame(raf);clearTimeout(fallback);
      if(reduce){rot=target;render();return}
      const tick=()=>{
        const d=wrap(target-rot);
        if(Math.abs(d)<.002){rot=target;render();return}
        rot+=d*.16;render();raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
      fallback=setTimeout(()=>{if(Math.abs(wrap(target-rot))>.01){cancelAnimationFrame(raf);rot=target;render()}},900);
    }
    function go(i){target=((i%N)+N)%N;setActive(target);animate()}

    $('#prev').addEventListener('click',e=>{e.stopPropagation();go(active-1)});
    $('#next').addEventListener('click',e=>{e.stopPropagation();go(active+1)});
    dots.forEach(d=>d.addEventListener('click',()=>go(+d.dataset.i)));
    bodies.forEach(el=>el.addEventListener('click',()=>{if(!dragMoved)go(+el.dataset.i)}));
    stage.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'){e.preventDefault();go(active+1)}
      else if(e.key==='ArrowLeft'){e.preventDefault();go(active-1)}
    });

    // Drag / swipe to spin the orbit
    let drag=null,dragMoved=false;
    stage.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('.nav'))return;
      drag={x:e.clientX,y:e.clientY,rot,id:e.pointerId};dragMoved=false;
    });
    stage.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!dragMoved){
        if(Math.abs(dx)<8)return;
        if(Math.abs(dy)>Math.abs(dx)){drag=null;return} // vertical: let the page scroll
        dragMoved=true;stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);
      }
      rot=drag.rot-dx/(geo.rx*step*.9);render();
      const i=((Math.round(rot)%N)+N)%N;if(i!==active)setActive(i);
    });
    const end=()=>{
      if(!drag)return;drag=null;
      if(dragMoved){stage.classList.remove('dragging');go(Math.round(rot));setTimeout(()=>{dragMoved=false},0)}
    };
    stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

    function icons(){try{window.lucide?.createIcons({attrs:{'aria-hidden':'true','focusable':'false'}})}catch{}}
    addEventListener('resize',()=>{measure();render()});

    measure();
    const first=Math.max(0,SUBJECTS.findIndex(s=>s.status!=='soon'));
    rot=target=first;setActive(first);render();

    const [y,m,d]=UPDATED.split('-').map(Number),t=$('#updated');
    t.dateTime=UPDATED;
    try{t.textContent=new Date(y,m-1,d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch{t.textContent=UPDATED}

    const s=document.createElement('script');
    s.src='https://unpkg.com/lucide@1.44.0/dist/umd/lucide.min.js';s.async=true;
    s.onload=icons;
    document.head.appendChild(s);
  </script>
</body>
</html>
