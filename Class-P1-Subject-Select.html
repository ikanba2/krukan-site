<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#04050b">
  <title>ประถมศึกษาปีที่ 1 · เลือกวิชา | KruKan.in.th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Kanit:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#04050b;--paper:#f4f7ff;--cyan:#4ef4d2;--sun:#ffd34f;--a:#06b6d4;--hud:'Orbitron','Chakra Petch',sans-serif;--tech:'Chakra Petch','Kanit',sans-serif;--hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
    *{box-sizing:border-box}
    html{background:var(--ink)}
    body{margin:0;min-width:280px;color:var(--paper);font:400 15px/1.5 'Kanit',sans-serif;background:radial-gradient(700px circle at 0 0,color-mix(in srgb,var(--a) 18%,transparent),transparent 60%),linear-gradient(180deg,#05070f,#070a14);background-attachment:fixed;overflow-x:hidden}
    a{color:inherit}
    :where(a):focus-visible{outline:3px solid var(--sun);outline-offset:-3px}

    .page{width:min(1080px,100%);margin:auto;padding:22px 24px 16px}

    /* Header: current stage + switch stage */
    .head{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.08)}
    .avatar{width:76px;height:86px;flex:none;display:grid;place-items:end center;overflow:hidden;clip-path:var(--hex);background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--a) 55%,transparent),#0b1120 75%)}
    .avatar img{width:100%;height:auto;transform:translateY(8%)}
    .who{min-width:0;flex:1}
    .crumbs{display:flex;gap:6px;color:#7d8ca4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .crumbs a{color:#9fb0c6;text-decoration:none}
    .crumbs a:hover{color:var(--cyan)}
    .who h1{margin:2px 0 0;font:700 30px/1.25 var(--tech)}
    .who h1 small{margin-left:10px;font-size:11px!important;color:color-mix(in srgb,var(--a) 70%,#fff);font:700 10px/1 var(--hud);letter-spacing:.16em;vertical-align:middle}
    .switch{display:flex;gap:3px;flex:none}
    .switch a{display:grid;place-items:center;width:44px;height:36px;color:#9fb0c6;text-decoration:none;background:rgba(255,255,255,.05);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);font:500 14px/1 'Kanit',sans-serif;transition:background .2s,color .2s}
    .switch a:hover{color:#fff;background:color-mix(in srgb,var(--sc) 35%,transparent)}
    .switch a[aria-current]{color:#04120f;font-weight:700;background:var(--sc)}

    /* Subject list */
    .label{display:flex;align-items:center;gap:10px;margin:22px 0 12px;color:#9fb0c6;font-size:14px}
    .label b{color:#fff;font-weight:600;font-size:19px}
    .label span{color:var(--cyan);font:700 9.5px/1 var(--hud);letter-spacing:.18em}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
    .card{--cut:16px;position:relative;isolation:isolate;display:flex;align-items:center;gap:20px;padding:22px 24px;color:#fff;text-decoration:none;background:linear-gradient(120deg,color-mix(in srgb,var(--c) 70%,#fff),rgba(255,255,255,.08) 55%);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));transition:transform .25s cubic-bezier(.2,.8,.2,1)}
    .card::before{content:'';position:absolute;inset:1px;z-index:-1;clip-path:inherit;background:radial-gradient(ellipse at 0 50%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),linear-gradient(150deg,#121b2b,#0a101b)}
    a.card:hover{transform:translateY(-3px)}
    .icon{width:72px;height:82px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 50%,color-mix(in srgb,var(--c) 45%,#000));clip-path:var(--hex);transition:transform .35s cubic-bezier(.2,.8,.2,1.3)}
    .icon svg{width:34px;height:34px;stroke-width:2}
    a.card:hover .icon{transform:rotate(-10deg)}
    .info{min-width:0;flex:1}
    .info h2{margin:0;font:700 25px/1.3 var(--tech)}
    .meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;color:#9fb0c6;font-size:14px}
    .meta .theme{color:var(--sun)}
    .go{display:inline-flex;align-items:center;gap:8px;flex:none;height:44px;padding:0 20px 0 16px;color:#04120f;background:linear-gradient(100deg,#fff,var(--c));clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);font:600 16px/1 'Kanit',sans-serif;white-space:nowrap}
    .go svg{width:14px;height:14px;fill:currentColor}
    .card.locked{--c:#6c7b94;opacity:.55}
    .card.locked .go{color:#c8d2e2;background:#2a3446}
    .card.locked .go svg{fill:none}
    .card.locked .go{height:32px;padding:0 12px;font-size:13px}

    footer{margin-top:20px;color:#5f6f88;font-size:12.5px}
    footer a{color:#7d8ca4}

    @media(max-width:760px){
      .page{padding:12px 12px 10px}
      .head{flex-wrap:wrap;gap:10px 12px}
      .avatar{width:58px;height:66px}
      .who h1{font-size:23px}
      .switch{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
      .switch::-webkit-scrollbar{display:none}
      .switch a{flex:0 0 48px;height:36px;font-size:14px}
      .grid{grid-template-columns:1fr}
      .card{gap:14px;padding:16px;flex-wrap:wrap}.info h2{font-size:21px}.go{width:100%;justify-content:center}
      .icon{width:56px;height:64px}.icon svg{width:26px;height:26px}
      .card.locked{flex-wrap:nowrap;padding:10px 14px}.card.locked .icon{width:40px;height:46px}.card.locked .icon svg{width:20px;height:20px}.card.locked .info h2{font-size:17px}.card.locked .go{width:auto}
    }
    @media(max-width:340px){.go span{display:none}.go{padding:0 12px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header class="head">
      <span class="avatar" aria-hidden="true"><img id="stage-mascot" alt="" width="360" height="420"></span>
      <div class="who">
        <nav class="crumbs" aria-label="ตำแหน่งปัจจุบัน" id="crumbs"></nav>
        <h1 id="stage-title"></h1>
      </div>
      <nav class="switch" aria-label="เปลี่ยนชั้นเรียน" id="switch"></nav>
    </header>

    <main>
      <p class="label" id="label"></p>
      <div class="grid" id="grid"></div>
    </main>

    <footer>KruKan.in.th · อัปเดตล่าสุด <time id="updated"></time> · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license noopener noreferrer">CC BY-NC-SA 4.0</a></footer>
  </div>

  <script>
    /* ===================== ตั้งค่าหน้านี้ ===================== */
    const SITE='https://www.krukan.in.th';
    const UPDATED='2026-10-10'; // ปี ค.ศ.-เดือน-วัน

    // ข้อมูลชั้นเรียน: เปลี่ยนตรงนี้เมื่อนำไปใช้กับชั้นอื่น
    const STAGE={
      code:'PRIMARY 1',
      short:'ป.1',
      name:'ประถมศึกษาปีที่ 1',
      color:'#06b6d4',
      mascot:'https://lh3.googleusercontent.com/d/13KExfpO-RBtatZOcX8NG7N5Sh4dGlQP_=w360',
      url:'/Class/Primary1'
    };

    // รายวิชา: เพิ่มวิชาใหม่ได้โดยเพิ่ม { ... } ต่อท้าย
    // status: 'open' = เปิดเรียนแล้ว · 'soon' = แสดงเป็นการ์ดจาง "เร็ว ๆ นี้"
    const SUBJECTS=[
      {
        title:'วิทยาการคำนวณ', icon:'wand-sparkles', color:'#06b6d4',
        theme:'แผนการเดินทางสู่จอมขมังเวทน้อย',
        meta:['9 บทเรียน','2 ภาคเรียน'],
        url:'https://sites.google.com/view/krukansite/Class/Primary1/P1-Technology-',
        status:'open'
      }
      ,{title:'คณิตศาสตร์', icon:'calculator', color:'#f59e0b', url:'', status:'soon'}
      ,{title:'ภาษาไทย', icon:'book-open-text', color:'#ec4899', url:'', status:'soon'}
      ,{title:'ภาษาอังกฤษ', icon:'languages', color:'#8b5cf6', url:'', status:'soon'}
      // เมื่อวิชาไหนพร้อม: ใส่ url และเปลี่ยน status เป็น 'open'
    ];

    // ชั้นเรียนทั้งหมด (ปุ่มเปลี่ยนชั้น)
    const STAGES=[
      ['ป.1','/Class/Primary1','#06b6d4'],['ป.2','/Class/Primary2','#3b82f6'],['ป.3','/Class/Primary3','#14b8a6'],
      ['ป.4','/Class/Primary4','#f59e0b'],['ป.5','/Class/Primary5','#f97316'],['ป.6','/Class/Primary6','#eab308'],
      ['ม.1','/Class/Secondary1','#ec4899'],['ม.2','/Class/Secondary2','#8b5cf6'],['ม.3','/Class/Secondary3','#d946ef']
    ];
    /* ======================================================== */

    const $=s=>document.querySelector(s);
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const link=p=>/^https?:/i.test(p)?p:SITE+p;
    const ext='target="_blank" rel="noopener noreferrer"';

    document.documentElement.style.setProperty('--a',STAGE.color);
    document.title=STAGE.name+' · เลือกวิชา | KruKan.in.th';
    $('#stage-mascot').src=STAGE.mascot;
    $('#crumbs').innerHTML='<a href="'+link('/home')+'" '+ext+'>หน้าแรก</a><span aria-hidden="true">›</span><a href="'+link('/Class')+'" '+ext+'>ห้องเรียน</a><span aria-hidden="true">›</span><span aria-current="page">'+esc(STAGE.short)+'</span>';
    $('#stage-title').innerHTML=esc(STAGE.name)+'<small lang="en">'+esc(STAGE.code)+'</small>';
    $('#switch').innerHTML=STAGES.map(([n,p,c])=>'<a style="--sc:'+c+'" href="'+link(p)+'" '+ext+(p===STAGE.url?' aria-current="page"':'')+'>'+n+'</a>').join('');

    const open=SUBJECTS.filter(s=>s.status!=='soon').length;
    $('#label').innerHTML='<b>เลือกวิชา</b>'+open+' วิชา <span lang="en">SUBJECT SELECT</span>';
    $('#grid').innerHTML=SUBJECTS.map(s=>{
      const locked=s.status==='soon';
      const meta=[s.theme?'<span class="theme">✦ '+esc(s.theme)+'</span>':'',...(s.meta||[]).map(m=>'<span>'+esc(m)+'</span>')].join('');
      const body='<span class="icon" aria-hidden="true"><i data-lucide="'+s.icon+'"></i></span>'+
        '<div class="info"><h2>'+esc(s.title)+'</h2><div class="meta">'+meta+'</div></div>'+
        '<span class="go">'+(locked?'<i data-lucide="lock"></i><span>เร็ว ๆ นี้</span>':'<i data-lucide="play"></i><span>เข้าเรียน</span>')+'</span>';
      return locked
        ?'<div class="card locked" style="--c:'+s.color+'">'+body+'</div>'
        :'<a class="card" style="--c:'+s.color+'" href="'+link(s.url)+'" '+ext+' aria-label="เข้าเรียนวิชา'+esc(s.title)+'">'+body+'</a>';
    }).join('');

    const [y,m,d]=UPDATED.split('-').map(Number),t=$('#updated');
    t.dateTime=UPDATED;
    try{t.textContent=new Date(y,m-1,d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch{t.textContent=UPDATED}

    const s=document.createElement('script');
    s.src='https://unpkg.com/lucide@1.44.0/dist/umd/lucide.min.js';s.async=true;
    s.onload=()=>{try{lucide.createIcons({attrs:{'aria-hidden':'true','focusable':'false'}})}catch{}};
    document.head.appendChild(s);
  </script>
</body>
</html>
