<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0824">
  <title>ประถมศึกษาปีที่ 2 · เลือกวิชา | KruKan.in.th</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Kanit:wght@400;500;600;700&family=Orbitron:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0a0824;--paper:#f4f7ff;--cyan:#4ef4d2;--sun:#ffd34f;--a:#06b6d4;--c:#06b6d4;--hud:'Orbitron','Chakra Petch',sans-serif;--tech:'Chakra Petch','Kanit',sans-serif;--hex:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);--planet:180px}
    *{box-sizing:border-box}
    html{background:var(--ink)}
    html,body{height:100%}
    body{margin:0;min-width:280px;color:var(--paper);font:400 15px/1.5 'Kanit',sans-serif;background:transparent;overflow-x:hidden}
    a,button{font:inherit;color:inherit}
    :where(a,button):focus-visible{outline:3px solid var(--sun);outline-offset:3px}
    html.transparent,html.transparent body{background:transparent}
    html.transparent .space{display:none}

    /* ===== Galaxy backdrop ===== */
    .space{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:
      radial-gradient(ellipse 55% 45% at 50% 50%,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%),
      radial-gradient(ellipse 50% 45% at 6% 12%,#7c3aed66,transparent 70%),
      radial-gradient(ellipse 45% 40% at 96% 92%,#1e6fd966,transparent 70%),
      radial-gradient(ellipse 35% 35% at 92% 8%,#db277755,transparent 70%),
      radial-gradient(ellipse 35% 30% at 10% 95%,#0891b244,transparent 70%),
      linear-gradient(115deg,transparent 30%,rgba(255,236,210,.05) 44%,rgba(200,180,255,.08) 50%,rgba(255,236,210,.05) 56%,transparent 70%),
      linear-gradient(180deg,#0e0b30,#0a0824 50%,#080d26)}
    .space::before{content:'';position:absolute;inset:0;background:radial-gradient(1200px 500px at 50% 50%,rgba(255,255,255,.03),transparent 70%);mix-blend-mode:screen}
    .stars,.stars::after{position:absolute;inset:-50%;background-image:
      radial-gradient(1px 1px at 23px 41px,#fff,transparent),radial-gradient(1px 1px at 87px 113px,#fffc,transparent),
      radial-gradient(1.5px 1.5px at 151px 29px,#cfe8ff,transparent),radial-gradient(1px 1px at 199px 171px,#fff9,transparent),
      radial-gradient(1px 1px at 61px 197px,#fff,transparent),radial-gradient(1.5px 1.5px at 131px 151px,#ffe9c9,transparent),
      radial-gradient(1px 1px at 173px 83px,#fffa,transparent),radial-gradient(1px 1px at 11px 131px,#fff8,transparent),
      radial-gradient(1px 1px at 109px 63px,#fff9,transparent);background-size:180px 180px}
    .stars{animation:drift 160s linear infinite;filter:drop-shadow(0 0 2px #fff)}
    .stars::after{content:'';inset:0;background-size:290px 290px;opacity:.7;animation:twinkle 4s ease-in-out infinite alternate}
    @keyframes drift{to{transform:translate(180px,90px)}}
    @keyframes twinkle{from{opacity:.25}to{opacity:.9}}

    /* Curved planet surface along the bottom edge, glowing in the selected subject's colour */
    .horizon{position:absolute;left:50%;top:calc(100% - 40px);width:max(180%,1400px);aspect-ratio:3.2;border-radius:50%;transform:translateX(-50%);background:radial-gradient(ellipse 60% 40% at 50% 0,color-mix(in srgb,var(--c) 30%,#1a1d4a) 0,#0e1033 35%,#070820 70%),#070820;box-shadow:0 -6px 30px color-mix(in srgb,var(--c) 55%,transparent),0 -30px 90px color-mix(in srgb,var(--c) 28%,transparent),inset 0 14px 30px color-mix(in srgb,var(--c) 30%,transparent);transition:box-shadow .6s}
    .horizon::before{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 46% 6%,rgba(255,255,255,.06) 0 22px,transparent 23px),radial-gradient(circle at 57% 9%,rgba(0,0,0,.25) 0 34px,transparent 35px),radial-gradient(circle at 38% 12%,rgba(0,0,0,.22) 0 18px,transparent 19px),radial-gradient(circle at 63% 4%,rgba(255,255,255,.05) 0 12px,transparent 13px);opacity:.9}
    .page{display:flex;flex-direction:column;width:min(1100px,100%);min-height:100%;margin:auto;padding:20px 24px 14px;overflow-x:hidden;overflow-x:clip}

    /* ===== Header ===== */
    .head{display:flex;align-items:center;gap:14px}
    .avatar{width:96px;height:72px;flex:none;display:grid;place-items:center;overflow:visible;background:radial-gradient(ellipse 50% 40% at 50% 60%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
    .avatar img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px #000a) drop-shadow(0 0 10px color-mix(in srgb,var(--c) 45%,transparent));animation:fly 3.4s ease-in-out infinite}
    @keyframes fly{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(1.5deg)}}
    .avatar .avatar-text{align-self:center;font:800 18px/1 var(--tech);color:#fff;text-shadow:0 1px 6px #0008}
    .who{min-width:0;flex:1}
    .crumbs{display:flex;gap:6px;color:#7d8ca4;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .crumbs a{color:#9fb0c6;text-decoration:none}
    .crumbs a:hover{color:var(--cyan)}
    .who h1{display:inline-block;margin:2px 0 0;font:700 28px/1.25 var(--tech);vertical-align:middle}
    .who h1 small{margin-left:10px;color:color-mix(in srgb,var(--a) 70%,#fff);font:700 11px/1 var(--hud);letter-spacing:.16em;vertical-align:middle}
    .switch{position:relative;flex:none;align-self:flex-start;margin-top:4px}
    .switch-btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 10px 0 14px;border:1px solid rgba(255,255,255,.2);color:#c9d4e3;background:rgba(10,14,34,.55);font:500 13.5px/1 'Kanit',sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
    .switch-btn b{color:#fff;font-weight:700}
    .switch-btn svg{width:16px;height:16px;transition:transform .2s}
    .switch-btn:hover{border-color:color-mix(in srgb,var(--a) 70%,#fff);background:rgba(10,14,34,.8)}
    .switch-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
    .switch-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:400;display:grid;grid-template-columns:repeat(3,52px);gap:4px;padding:10px;background:rgba(10,14,34,.97);border:1px solid rgba(255,255,255,.16);box-shadow:0 16px 40px #000a}
    .switch-menu[hidden]{display:none}
    .switch-menu a{display:grid;place-items:center;width:52px;height:36px;color:#9fb0c6;text-decoration:none;background:rgba(255,255,255,.06);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%);font:500 14px/1 'Kanit',sans-serif;transition:background .2s,color .2s}
    .switch a:hover{color:#fff;background:color-mix(in srgb,var(--sc) 35%,transparent)}
    .switch a[aria-current]{color:#04120f;font-weight:700;background:var(--sc)}

    /* Mascot speech bubble */
    .say{position:relative;display:inline-block;max-width:100%;margin:2px 0 0 18px;vertical-align:middle;padding:5px 12px;color:#fff;background:color-mix(in srgb,var(--c) 30%,rgba(10,14,34,.92));border:1px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:12px;font-size:13.5px;line-height:1.4;transition:background .4s,border-color .4s}
    .say::before{content:'';position:absolute;left:-7px;top:9px;width:12px;height:12px;background:inherit;border-left:inherit;border-bottom:inherit;transform:rotate(45deg)}
    .say.pop{animation:pop .35s cubic-bezier(.2,.9,.2,1.3)}
    @keyframes pop{from{transform:scale(.85);opacity:0}}

    /* Mission heading */
    .mission{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 0;font:700 19px/1.3 var(--tech);text-shadow:0 2px 12px #000}
    .mission span{padding:3px 8px;color:#04120f;background:var(--sun);font:800 10px/1 var(--hud);letter-spacing:.16em}

    /* First-visit swipe hint (touch screens) */
    .swipe-hint{position:absolute;left:50%;top:44%;z-index:300;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 14px;color:#fff;background:rgba(10,14,34,.78);border-radius:14px;font-size:13px;transform:translate(-50%,-50%);pointer-events:none;transition:opacity .4s}
    .swipe-hint svg{width:30px;height:30px;animation:swipe 1.3s ease-in-out infinite}
    .swipe-hint[hidden]{display:none}
    .swipe-hint.out{opacity:0}
    @keyframes swipe{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}

    /* ===== Orbit stage ===== */
    .galaxy{position:relative;flex:1;display:flex;flex-direction:column;margin-top:6px}
    .stage{position:relative;flex:1 1 290px;min-height:290px;max-height:540px;touch-action:pan-y;user-select:none;cursor:grab;outline:none}
    .stage.dragging{cursor:grabbing}
    .stage:focus-visible .orbit{border-color:var(--sun);border-style:dashed}
    .orbit{position:absolute;border-radius:50%;border:1px solid color-mix(in srgb,var(--c) 35%,rgba(255,255,255,.55));box-shadow:0 0 6px color-mix(in srgb,var(--c) 35%,transparent);pointer-events:none;transition:border-color .5s,box-shadow .5s}
    .orbit::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:10px solid color-mix(in srgb,var(--c) 12%,rgba(255,255,255,.04));filter:blur(7px)}
    .orbit.back{clip-path:inset(-30px -30px 50% -30px);opacity:.35}
    .orbit.front{z-index:50;clip-path:inset(50% -30px -30px -30px);opacity:.8}
    .body{position:absolute;left:0;top:0;width:calc(var(--planet)*1.7);height:calc(var(--planet) + 30px);padding:0;border:0;background:none;display:grid;place-items:center;cursor:pointer;will-change:transform,opacity}
    /* fixed 1x1 grid so oversized layers (ring, aura) overflow evenly around the planet instead of stretching the cell */
    .body{grid-template:minmax(0,1fr)/minmax(0,1fr)}
    .body>*{grid-area:1/1}
    .body.active{cursor:default}

    /* Planet */
    .halo{width:calc(var(--planet)*1.45);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pc) 45%,transparent),transparent 65%);opacity:.55}
    .body.active .halo{opacity:1;animation:pulse 3.2s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
    .ring{width:calc(var(--planet)*2.2);aspect-ratio:1;border-radius:50%;transform:rotate(-16deg) scaleY(.25);background:radial-gradient(circle,transparent 0 46%,color-mix(in srgb,var(--pc) 25%,rgba(255,240,215,.28)) 47%,color-mix(in srgb,var(--pc) 35%,rgba(255,244,225,.6)) 53%,rgba(255,255,255,.2) 56%,color-mix(in srgb,var(--pc) 30%,rgba(255,240,215,.55)) 59.5%,transparent 61%,transparent 62.5%,color-mix(in srgb,var(--pc) 25%,rgba(255,240,215,.42)) 63.5%,color-mix(in srgb,var(--pc) 15%,rgba(255,240,215,.2)) 69%,transparent 70%),repeating-radial-gradient(circle,rgba(255,255,255,.08) 0 1px,transparent 1px 3px);-webkit-mask:radial-gradient(circle,transparent 46%,#000 46.5%,#000 69.5%,transparent 70%);mask:radial-gradient(circle,transparent 46%,#000 46.5%,#000 69.5%,transparent 70%);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--pc) 40%,transparent))}
    .ring.front{clip-path:inset(50% 0 0 0);z-index:2}
    .planet{position:relative;z-index:1;width:var(--planet);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;border-radius:50%;color:#fff;background:radial-gradient(circle at 32% 28%,#ffffffd0 0,color-mix(in srgb,var(--pc) 55%,#fff) 9%,var(--pc) 38%,color-mix(in srgb,var(--pc) 45%,#000) 74%,#05040c 100%);box-shadow:0 0 40px color-mix(in srgb,var(--pc) 55%,transparent),inset -16px -18px 36px #000a}
    .planet::before{content:'';position:absolute;inset:-20%;border-radius:50%;background:repeating-linear-gradient(-16deg,transparent 0 14px,rgba(255,255,255,.12) 14px 20px,transparent 20px 34px,rgba(0,0,0,.14) 34px 42px);mix-blend-mode:overlay;animation:spinband 24s linear infinite}
    .planet::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 75%,transparent 40%,rgba(0,0,0,.45) 75%)}
    @keyframes spinband{to{background-position:240px 0}}
    .planet svg{position:relative;z-index:1;width:calc(var(--planet)*.3);height:calc(var(--planet)*.3);stroke-width:1.8;filter:drop-shadow(0 2px 6px #0009);opacity:.92}
    .moon-orbit{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(-16deg) scaleY(.34);animation:moonz 10s linear infinite}
    .moon{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9aa6bb 60%,#3a4255);box-shadow:0 0 8px #fff6;animation:moon 10s linear infinite}
    @keyframes moon{0%{transform:rotate(0deg) translateX(calc(var(--planet)*.82)) rotate(0deg) scaleY(2.94) rotate(16deg) scale(.95)}25%{transform:rotate(90deg) translateX(calc(var(--planet)*.82)) rotate(-90deg) scaleY(2.94) rotate(16deg) scale(1.15)}50%{transform:rotate(180deg) translateX(calc(var(--planet)*.82)) rotate(-180deg) scaleY(2.94) rotate(16deg) scale(.95)}75%{transform:rotate(270deg) translateX(calc(var(--planet)*.82)) rotate(-270deg) scaleY(2.94) rotate(16deg) scale(.75)}100%{transform:rotate(360deg) translateX(calc(var(--planet)*.82)) rotate(-360deg) scaleY(2.94) rotate(16deg) scale(.95)}}
    @keyframes moonz{0%,49.9%{z-index:3}50%,100%{z-index:0}}
    .body:not(.active) .moon-orbit{display:none}
    .body.locked .planet{filter:saturate(.85) brightness(.9)}

    /* ===== Element planets: each element has its own surface, texture and effect ===== */
    .aura{width:var(--planet);aspect-ratio:1;border-radius:50%;pointer-events:none}
    @keyframes flicker{to{opacity:.55}}
    @keyframes spin2{to{transform:rotate(360deg)}}
    /* 🔥 Fire: molten lava + flame corona */
    .el-fire .planet{background:radial-gradient(circle at 32% 28%,#fff6c0 0,#ffc44d 10%,#ff6a1a 34%,#b91c0c 64%,#3b0603 100%)}
    .el-fire .planet::before{background:radial-gradient(circle at 25% 60%,#ffe08a 0 2px,transparent 3px) 0 0/38px 38px,repeating-radial-gradient(circle at 62% 58%,transparent 0 10px,rgba(255,214,90,.45) 11px 12px,transparent 13px 22px),repeating-linear-gradient(35deg,transparent 0 16px,rgba(60,0,0,.35) 16px 22px);mix-blend-mode:screen;animation:lava 14s linear infinite}
    @keyframes lava{to{background-position:38px 38px,0 0,60px 0}}
    .el-fire .aura{width:calc(var(--planet)*1.34);background:conic-gradient(from 0deg,transparent 0 6%,#ff7a1aaa 10%,transparent 16% 28%,#ffb347aa 33%,transparent 40% 55%,#ff4d1aaa 60%,transparent 66% 78%,#ffd166aa 84%,transparent 90%);filter:blur(7px);animation:spin2 7s linear infinite,flicker 1.4s ease-in-out infinite alternate}
    /* 💧 Water: ocean waves + ripple */
    .el-water .planet{background:radial-gradient(circle at 32% 28%,#effaff 0,#93e1ff 10%,#2f8cf0 38%,#1d3fa8 70%,#0a1747 100%)}
    .el-water .planet::before{background:repeating-linear-gradient(172deg,rgba(255,255,255,.24) 0 2px,transparent 2px 13px),repeating-linear-gradient(8deg,rgba(255,255,255,.09) 0 1px,transparent 1px 9px);mix-blend-mode:overlay;animation:waves 5s linear infinite}
    @keyframes waves{to{background-position:0 26px,40px 0}}
    .el-water .aura{width:calc(var(--planet)*1.2);background:radial-gradient(circle,transparent 52%,#7dd3fc45 59%,#38bdf814 66%,transparent 72%);filter:blur(2px)}
    @keyframes ripple{0%{transform:scale(.96);opacity:.75}100%{transform:scale(1.45);opacity:0}}
    /* 🌿 Nature: continents + drifting clouds */
    .el-nature .planet{background:radial-gradient(ellipse 30% 20% at 34% 42%,#5fe08a 0 55%,transparent 58%),radial-gradient(ellipse 20% 28% at 64% 60%,#22a35a 0 55%,transparent 58%),radial-gradient(ellipse 16% 10% at 56% 26%,#b5e85c 0 55%,transparent 58%),radial-gradient(ellipse 14% 18% at 26% 72%,#3fbf6f 0 55%,transparent 58%),radial-gradient(circle at 32% 28%,#e6fff0 0,#5eead4 9%,#0f9488 36%,#0b4f5c 70%,#04202a 100%)}
    .el-nature .planet::before{background:radial-gradient(ellipse 22% 7% at 30% 30%,rgba(255,255,255,.6),transparent 70%),radial-gradient(ellipse 26% 6% at 70% 48%,rgba(255,255,255,.5),transparent 70%),radial-gradient(ellipse 18% 6% at 45% 70%,rgba(255,255,255,.45),transparent 70%);background-size:200% 100%;mix-blend-mode:normal;animation:clouds 22s linear infinite}
    @keyframes clouds{to{background-position:200% 0,200% 0,200% 0}}
    .el-nature .aura{width:calc(var(--planet)*1.2);background:radial-gradient(circle,transparent 52%,#86efac40 59%,#4ade8014 66%,transparent 72%);filter:blur(2px)}
    /* ⚡ Thunder: electric storm + lightning flashes */
    .el-thunder .planet{background:radial-gradient(circle at 32% 28%,#fefce8 0,#d8ccff 9%,#8b5cf6 36%,#3b0d7a 72%,#0b0418 100%)}
    .el-thunder .planet::before{background:repeating-linear-gradient(-18deg,rgba(253,224,71,.22) 0 5px,transparent 5px 16px,rgba(20,0,60,.32) 16px 24px);mix-blend-mode:overlay;animation:spinband 10s linear infinite}
    .el-thunder .aura{width:calc(var(--planet)*1.22);background:radial-gradient(circle,transparent 52%,#c4b5fd40 59%,#a78bfa14 66%,transparent 72%);filter:blur(2px)}
    .bolt{position:absolute;z-index:4;width:calc(var(--planet)*.2);height:auto;fill:#fff59d;filter:drop-shadow(0 0 6px #fde047) drop-shadow(0 0 12px #a78bfa);opacity:0;animation:zap 3.2s steps(1) infinite;pointer-events:none}
    .bolt.b1{left:14%;top:2%;transform:rotate(-18deg)}
    .bolt.b2{right:16%;bottom:6%;transform:rotate(160deg);animation-delay:1.7s}
    @keyframes zap{0%,100%{opacity:0}8%{opacity:1}10%{opacity:.15}12%{opacity:1}17%{opacity:0}}
    /* ❄️ Ice: crystal facets + sparkles */
    .el-ice .planet{background:radial-gradient(circle at 32% 28%,#fff 0,#e7f6ff 12%,#9fd8ff 36%,#3b74c8 74%,#0c1a4a 100%)}
    .el-ice .planet::before{background:conic-gradient(from 15deg at 42% 44%,rgba(255,255,255,.35),transparent 8%,rgba(255,255,255,.18) 17%,transparent 26%,rgba(255,255,255,.3) 38%,transparent 47%,rgba(255,255,255,.15) 60%,transparent 70%,rgba(255,255,255,.28) 84%,transparent 92%),repeating-linear-gradient(60deg,transparent 0 18px,rgba(255,255,255,.2) 18px 19px),repeating-linear-gradient(-60deg,transparent 0 18px,rgba(255,255,255,.15) 18px 19px);mix-blend-mode:screen;animation:none}
    .el-ice .aura{width:calc(var(--planet)*1.32);background:radial-gradient(circle at 20% 30%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 82% 24%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 72% 86%,#fff 0 2px,transparent 3px),radial-gradient(circle at 14% 76%,#fff 0 1px,transparent 2px),radial-gradient(circle,transparent 57%,#bae6fd55 63%,transparent 72%);animation:flicker 1.6s ease-in-out infinite alternate}
    /* 🌪️ Wind: spinning swirl */
    .el-wind .planet{background:radial-gradient(circle at 32% 28%,#f0fffb 0,#99f6e4 10%,#14b8a6 38%,#0f5f6b 72%,#06222a 100%)}
    .el-wind .planet::before{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.2) 0 6deg,transparent 6deg 30deg);mix-blend-mode:overlay;animation:spin2 6s linear infinite}
    .el-wind .aura{width:calc(var(--planet)*1.3);border:2px dashed #99f6e488;animation:spin2 5s linear infinite reverse}
    /* ✨ Light: radiant sun-like with rays */
    .el-light .planet{background:radial-gradient(circle at 40% 38%,#fff 0,#fff7cc 18%,#fde047 40%,#eab308 66%,#713f12 100%)}
    .el-light .planet::before{background:radial-gradient(circle at 40% 38%,rgba(255,255,255,.55),transparent 50%);animation:flicker 2s ease-in-out infinite alternate}
    .el-light .aura{width:calc(var(--planet)*1.5);background:repeating-conic-gradient(from 0deg,#fde04766 0 4deg,transparent 4deg 18deg);-webkit-mask:radial-gradient(circle,transparent 33%,#000 35%,transparent 70%);mask:radial-gradient(circle,transparent 33%,#000 35%,transparent 70%);animation:spin2 24s linear infinite}
    /* 🪨 Rock: rusty desert world · ☣️ Toxic: acid swamp world (surfaces are painted in JS) */
    .el-rock .planet{background:radial-gradient(circle at 32% 28%,#ffe2c4 0,#e8935a 12%,#a8502a 40%,#5a2310 74%,#1c0904 100%)}
    .el-rock .aura{width:calc(var(--planet)*1.2);background:radial-gradient(circle,transparent 52%,#f59e6b40 59%,#d9774514 66%,transparent 72%);filter:blur(2px)}
    .el-toxic .planet{background:radial-gradient(circle at 32% 28%,#f7ffd0 0,#c6f04a 12%,#5f8f16 40%,#22400a 74%,#0a1403 100%)}
    .el-toxic .aura{width:calc(var(--planet)*1.24);background:radial-gradient(circle,transparent 52%,#bef26450 59%,#84cc1618 66%,transparent 72%);filter:blur(2px);animation:flicker 2.4s ease-in-out infinite alternate}
    /* 🌑 Dark: void with inner stars */
    .el-dark .planet{background:radial-gradient(circle at 32% 28%,#f5e8ff 0,#c084fc 8%,#6b21a8 34%,#2e1065 64%,#0a0418 100%)}
    .el-dark .planet::before{background:radial-gradient(1px 1px at 30% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 30%,#fff,transparent),radial-gradient(1px 1px at 45% 70%,#fff,transparent),radial-gradient(1px 1px at 72% 62%,#fff,transparent),conic-gradient(from 0deg at 50% 50%,transparent,#a855f744,transparent 30%,#a855f744 60%,transparent);mix-blend-mode:screen;animation:spin2 16s linear infinite}
    .el-dark .aura{width:calc(var(--planet)*1.26);background:radial-gradient(circle,transparent 55%,#a855f766 62%,#00000088 70%,transparent 74%)}

    /* Procedural surface textures (generated in JS) replace the flat CSS patterns */
    .planet.tex::before{display:none}
    .planet.tex::after{z-index:2;background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.34) 0,rgba(255,255,255,.1) 18%,transparent 36%),radial-gradient(circle at 34% 30%,transparent 38%,rgba(0,0,0,.42) 62%,rgba(0,0,0,.88) 86%)}
    .planet.tex{box-shadow:0 0 40px color-mix(in srgb,var(--pc) 50%,transparent),inset 0 0 calc(var(--planet)*.07) color-mix(in srgb,var(--pc) 70%,transparent)}
    .planet.tex svg{display:none}
    .surface,.clouds{position:absolute;inset:0;border-radius:50%;background-repeat:repeat-x;background-size:calc(var(--planet)*2) 100%;animation:turn 70s linear infinite}
    .clouds{animation-duration:44s}
    @keyframes turn{from{background-position:0 0}to{background-position:calc(var(--planet)*-2) 0}}

    /* Monster slot (image per subject). Locked subjects show a mysterious silhouette. */
    .monster{position:absolute;z-index:5;right:-4%;bottom:-6%;width:calc(var(--planet)*.72);aspect-ratio:1;background:no-repeat 0 0/300% 300%;filter:drop-shadow(0 8px 10px #000a);animation:hover 3.6s ease-in-out infinite;pointer-events:none;transition:background-position 0s}
    .monster:not(.ready){visibility:hidden}
    .body.locked .monster{filter:brightness(0) drop-shadow(0 0 8px var(--pc));opacity:.9}
    @keyframes hover{50%{transform:translateY(-7px)}}
    .el-tag{color:var(--c)}
    .mon-name{color:#e9d5ff}
    /* MaskRider Techno guide standing on the horizon (wide screens only) */
    .techno{position:absolute;left:-10px;bottom:70px;z-index:6;width:230px;height:auto;filter:drop-shadow(0 12px 14px #000a) drop-shadow(0 0 18px color-mix(in srgb,var(--c) 45%,transparent));pointer-events:none;animation:fly 3.6s ease-in-out infinite}
    .techno.swap{animation:pop .35s cubic-bezier(.2,.9,.2,1.3),fly 3.6s ease-in-out .35s infinite}
    @media(max-width:1000px){.techno{display:none}}
    .lock{position:absolute;z-index:4;right:24%;top:10%;width:30px;height:34px;display:grid;place-items:center;color:#1a0d00;background:var(--sun);clip-path:var(--hex)}
    .lock svg{width:15px;height:15px;stroke-width:2.6}

    .nav{position:absolute;z-index:200;width:48px;height:54px;display:grid;place-items:center;border:0;color:#fff;background:rgba(255,255,255,.08);clip-path:var(--hex);cursor:pointer;transform:translate(-50%,-50%);transition:background .2s}
    .nav:hover{background:color-mix(in srgb,var(--c) 50%,transparent)}
    .nav svg{width:20px;height:20px;stroke-width:2.6}

    /* Info of the selected subject */
    .info{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
    .info.swap{animation:swap .4s ease}
    @keyframes swap{from{opacity:0;transform:translateY(8px)}}
    .info h2{margin:0;font:700 28px/1.25 var(--tech);text-shadow:0 2px 14px #000}
    .theme{margin:2px 0 0;color:var(--sun);font-size:14.5px}
    .meta{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 12px;margin-top:2px;color:#9fb0c6;font-size:13.5px}
    .go{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;margin-top:12px;padding:0 28px 0 22px;color:#04120f;text-decoration:none;background:linear-gradient(100deg,#fff,var(--c));clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font:600 16px/1 'Kanit',sans-serif;white-space:nowrap;transition:filter .2s,transform .2s}
    .go svg{width:14px;height:14px;fill:currentColor}
    a.go:hover{filter:brightness(1.08) drop-shadow(0 0 12px var(--c));transform:translateY(-2px)}
    .go.soon{position:relative;isolation:isolate;height:40px;color:#c8d2e2;font-weight:500;background:rgba(255,255,255,.3);cursor:default}
    .go.soon::before{content:'';position:absolute;inset:1px;z-index:-1;background:rgba(10,14,34,.8);clip-path:inherit}
    .go.soon svg{fill:none}
    .soon-note{margin:2px 0 0;color:#9fb0c6;font-size:14px}

    .picker{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:16px;padding:2px}
    /* Border = the button's own background; the fill sits 1–2px inside with the same cut corners, so the outline follows the diagonals */
    .pick{--bd:rgba(255,255,255,.2);--fill:rgba(11,15,40,.94);--bw:1px;position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;min-width:180px;padding:9px 16px 9px 10px;border:0;color:#dfe7f3;text-align:left;background:var(--bd);clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);cursor:pointer;transition:transform .25s}
    .pick::before{content:'';position:absolute;inset:var(--bw);z-index:-1;background:var(--fill);clip-path:inherit;transition:background .25s}
    .pick:hover{--bd:color-mix(in srgb,var(--pc) 70%,#fff);--fill:color-mix(in srgb,var(--pc) 16%,#0b0f28);transform:translateY(-2px)}
    .pick[aria-selected="true"]{--bd:var(--pc);--bw:2px;--fill:linear-gradient(100deg,color-mix(in srgb,var(--pc) 40%,#0a0e22),#0b0f28 85%)}
    .pick[aria-selected="true"]::after{content:'';position:absolute;left:14px;right:14px;bottom:2px;height:3px;background:var(--pc);box-shadow:0 0 10px var(--pc)}
    .pick-ico{width:34px;height:38px;flex:none;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 55%,#fff),var(--pc) 45%,color-mix(in srgb,var(--pc) 45%,#000));clip-path:var(--hex)}
    .pick-ico svg{width:17px;height:17px;stroke-width:2.2}
    .pick.soon .pick-ico{filter:saturate(.55) brightness(.85)}
    .pick b{display:block;font-size:15px;font-weight:600;line-height:1.3}
    .pick small{display:block;font-size:11.5px;line-height:1.3;color:var(--cyan)}
    .pick.soon small{color:#9aa6bb}

    footer{margin-top:auto;padding-top:12px;color:#b6c2d6;font-size:12px;text-align:center;text-shadow:0 1px 6px #0009}
    footer a{color:#dfe7f3}

    @media(max-width:760px){
      .page{padding:12px 12px 10px}
      .head{flex-wrap:wrap;gap:10px 12px}
      .avatar{width:72px;height:56px}
      .who h1{font-size:22px}
      .who h1 small{display:none}
      .head{flex-wrap:nowrap;align-items:flex-start}
      .switch-btn span{display:none}
      .switch-btn{padding:0 8px 0 10px}
      .say{display:table;margin:6px 0 0 8px;font-size:12.5px}
      .mission{margin-top:10px;font-size:17px}
      .stage{flex-basis:236px;min-height:236px;max-height:400px}
      .ring{width:calc(var(--planet)*1.95)}
      .nav{display:none}
      .info h2{font-size:23px}
      /* Phones: every subject visible at once in a 2-column grid (no sideways scrolling) */
      .picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
      .pick{min-width:0;gap:8px;padding:7px 10px 7px 7px}
      .pick-ico{width:30px;height:34px}
      .pick-ico svg{width:15px;height:15px}
      .pick b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .pick small{font-size:11px;white-space:nowrap}
      .pick>span:last-child{min-width:0}
    }
    @media(max-width:360px){.pick{gap:6px;padding:6px 8px 6px 6px}.pick-ico{width:24px;height:28px}.pick-ico svg{width:13px;height:13px}.pick b{font-size:13px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    /* AI Disclosure Statement (contest rule 10.3): opens a SweetAlert2 popup */
    .ai-note{margin:8px auto 0;text-align:center}
    .ai-btn{padding:4px 14px;color:#dfe7f3;background:rgba(10,14,34,.6);border:1px solid rgba(255,255,255,.22);border-radius:999px;font:500 12px/1.5 'Kanit',sans-serif;cursor:pointer;transition:border-color .2s,background .2s}
    .ai-btn:hover{border-color:rgba(255,255,255,.55);background:rgba(10,14,34,.85)}
    .swal2-popup.ai-popup{font-family:'Kanit',sans-serif;border:1px solid rgba(255,255,255,.18);border-radius:18px}
    .ai-popup .swal2-title{font-size:20px}
    .ai-popup .ai-body{text-align:left;font-size:14px;line-height:1.65;color:#c9d4e3}
    .ai-popup dl{margin:0}.ai-popup dt{margin-top:10px;color:#fff;font-weight:600}.ai-popup dd{margin:2px 0 0}.ai-popup ul{margin:2px 0 0;padding-left:20px}
    .ai-popup b{color:#fff}
    .ai-popup .ai-ok{color:#04120f!important;font-weight:600;font-family:inherit}
    .ai-fallback{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:rgba(3,4,12,.72)}
    .ai-fallback>div{width:min(640px,100%);max-height:85%;overflow:auto;padding:20px 22px;background:#0b0f28;color:#e9f2ff;border:1px solid rgba(255,255,255,.18);border-radius:18px;font-family:'Kanit',sans-serif}
    .ai-fallback button{margin-top:14px;padding:8px 22px;border:0;border-radius:10px;background:#4ef4d2;color:#04120f;font:600 15px 'Kanit',sans-serif;cursor:pointer}
  </style>
</head>

    // Drive image links sometimes fail on the first try: retry a few times before giving up

    function loadDrive(id,w,ok,fail,tries=3){

    /* ----- Procedural planet textures: seamless (wraps left-right) fractal noise, coloured per element ----- */
    const TEX_W=512,TEX_H=256,PERIOD=6;
    function noise2(seed){
      let s=(seed*9301+49297)%233280;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
      const p=Array.from({length:256},(_,i)=>i);
      for(let i=255;i>0;i--){const j=Math.floor(rnd()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
      const perm=new Uint8Array(512);for(let i=0;i<512;i++)perm[i]=p[i&255];
      const val=Float32Array.from({length:256},rnd);
      const h=(a,b)=>val[perm[(perm[a&255]+(b&255))&511]];
      const fade=x=>x*x*(3-2*x);
      return (x,y,P)=>{ // value noise, periodic in x with period P
        const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
        const x0=((xi%P)+P)%P,x1=(x0+1)%P,u=fade(xf),v=fade(yf);
        return (h(x0,yi)*(1-u)+h(x1,yi)*u)*(1-v)+(h(x0,yi+1)*(1-u)+h(x1,yi+1)*u)*v;
      };
    }
    const fbm=(n,x,y,P,oct=5)=>{let a=.5,f=1,sum=0,norm=0;for(let o=0;o<oct;o++){sum+=a*n(x*f,y*f,P*f);norm+=a;a*=.5;f*=2}return sum/norm};
    const ss=(a,b,x)=>{const k=Math.min(1,Math.max(0,(x-a)/(b-a)));return k*k*(3-2*k)};
    const mixc=(c1,c2,k)=>[c1[0]+(c2[0]-c1[0])*k,c1[1]+(c2[1]-c1[1])*k,c1[2]+(c2[2]-c1[2])*k];
    const grad=(stops,x)=>{
      if(x<=stops[0][0])return stops[0][1];
      for(let i=1;i<stops.length;i++)if(x<=stops[i][0])return mixc(stops[i-1][1],stops[i][1],(x-stops[i-1][0])/(stops[i][0]-stops[i-1][0]));
      return stops[stops.length-1][1];
    };
    // Each painter returns [r,g,b] for surface, or [r,g,b,a] for the cloud layer
    const PAINT={
      nature:{surface:(n,m,x,y,u,v)=>{

        return mixc(c,[240,248,255],ss(.8,.92,Math.abs(v-.5)*2+(e-.5)*.35));
      },clouds:(n,m,x,y)=>[255,255,255,ss(.57,.8,fbm(m,x*2,y*2,PERIOD*2,6))*175]},
      water:{surface:(n,m,x,y)=>{
        const e=fbm(n,x,y,PERIOD,6);
        let c=grad([[0,[4,22,74]],[.45,[14,68,168]],[.68,[48,138,222]],[1,[130,205,255]]],e);
        if(e>.73)c=mixc(c,grad([[.73,[215,200,140]],[.8,[70,150,80]]],e),ss(.73,.76,e));

      },clouds:(n,m,x,y)=>[255,255,255,ss(.6,.82,fbm(m,x*2,y*2,PERIOD*2,6))*130]},
      fire:{surface:(n,m,x,y)=>{
        const e=fbm(n,x,y,PERIOD,5),r=1-Math.abs(2*fbm(m,x*2,y*2,PERIOD*2,4)-1);
        const base=grad([[0,[22,4,2]],[.5,[68,14,6]],[1,[128,34,10]]],e);
        return mixc(base,grad([[0,[255,96,20]],[1,[255,232,130]]],ss(.9,1,r)),ss(.8,.95,r));
      }},
      thunder:{surface:(n,m,x,y,u,v)=>{

        let c=grad([[0,[38,12,86]],[.35,[92,58,196]],[.65,[188,168,248]],[1,[250,232,170]]],b);
        const d=((u-.3)/.09)**2+((v-.62)/.055)**2;

        return mixc(grad([[0,[150,200,235]],[.6,[214,238,252]],[1,[250,253,255]]],e),[70,130,200],ss(.88,.97,r)*.8);
      }},
      wind:{surface:(n,m,x,y,u,v)=>{
        const w=fbm(n,x,y,PERIOD,4),t=v*11+w*6;
        return grad([[0,[8,60,70]],[.5,[30,170,160]],[1,[195,250,236]]],Math.sin(t)*.5+.5);
      }},
      light:{surface:(n,m,x,y)=>grad([[0,[255,138,20]],[.5,[255,200,60]],[1,[255,250,214]]],fbm(n,x*3,y*3,PERIOD*3,4))},
      dark:{surface:(n,m,x,y)=>{
        let c=grad([[0,[6,2,14]],[1,[44,16,86]]],fbm(n,x,y,PERIOD,5));
        c=mixc(c,[160,96,245],ss(.56,.8,fbm(m,x*1.5,y*1.5,PERIOD*1.5,4))*.6);
        return n(x*40,y*40,PERIOD*40)>.985?[255,255,255]:c;
      }},
      rock:{surface:(n,m,x,y,u,v)=>{
        const e=fbm(n,x,y,PERIOD,6);
        let c=grad([[0,[64,26,14]],[.42,[146,66,32]],[.66,[198,116,66]],[1,[236,192,142]]],e);
        const cr=fbm(m,x*3,y*3,PERIOD*3,3);
        c=mixc(c,[52,20,10],ss(.66,.74,cr)*.75);            // crater floors
        c=mixc(c,[240,205,165],ss(.74,.78,cr)*ss(.8,.74,cr)*.6); // crater rims
        return mixc(c,[245,235,225],ss(.86,.95,Math.abs(v-.5)*2)*.7);
      }},
      toxic:{surface:(n,m,x,y)=>{
        const e=fbm(n,x,y,PERIOD,6);
        let c=grad([[0,[18,34,8]],[.5,[84,128,20]],[.74,[170,206,36]],[1,[236,255,150]]],e);
        return mixc(c,[198,255,58],ss(.66,.76,fbm(m,x*2,y*2,PERIOD*2,4))*.85); // glowing acid pools
      },clouds:(n,m,x,y)=>[210,255,120,ss(.6,.82,fbm(m,x*2.5,y*2.5,PERIOD*2.5,5))*90]}
    };
    function paint(fn,seed){
      const cv=document.createElement('canvas');cv.width=TEX_W;cv.height=TEX_H;
      const ctx=cv.getContext('2d');if(!ctx)return null;
      const img=ctx.createImageData(TEX_W,TEX_H),d=img.data,n=noise2(seed),m=noise2(seed+77);
      for(let j=0;j<TEX_H;j++)for(let i=0;i<TEX_W;i++){
        const u=i/TEX_W,v=j/TEX_H,c=fn(n,m,u*PERIOD,v*PERIOD/2,u,v),k=(j*TEX_W+i)*4;
        d[k]=c[0];d[k+1]=c[1];d[k+2]=c[2];d[k+3]=c.length>3?c[3]:255;
      }
      ctx.putImageData(img,0,0);
      return cv.toDataURL('image/png');
    }
    // Bring monsters to life: step through poses from the 3x3 sheet (0 idle, 3 battle stance, 4 punch, 1 side)
    const POSE_LOOP=[0,0,3,3,0,0,4,0,0,1,0,3];
    let poseTick=0;
    setInterval(()=>{
      if(document.hidden||reduce)return;
      poseTick++;
      bodies.forEach((b,i)=>{const m=b.querySelector('.monster.ready');if(m&&!m.dataset.busy)setFrame(m,POSE_LOOP[(poseTick+i*3)%POSE_LOOP.length])});
    },650);
    // Monster sprite sheets (3x3 poses) from Drive
    SUBJECTS.forEach((s,i)=>{
      const m=monOf(s),el=bodies[i].querySelector('.monster');if(!m||!el)return;
      loadDrive(m.src||m.id,600,src=>{el.style.backgroundImage='url("'+src+'")';setFrame(el,0);el.classList.add('ready')},()=>el.remove());
    });
    // Generate one planet at a time so the page never freezes
    SUBJECTS.forEach((s,i)=>setTimeout(()=>{
      const P=PAINT[s.element];if(!P)return;
      const planet=bodies[i].querySelector('.planet');
      try{
        const add=(cls,url)=>{if(!url)return;const el=document.createElement('span');el.className=cls;el.style.backgroundImage='url('+url+')';el.setAttribute('aria-hidden','true');planet.insertBefore(el,planet.firstChild)};
        const seed=(STAGE.seed||0)*97+i*31;
        if(P.clouds)add('clouds',paint(P.clouds,seed+5));
        add('surface',paint(P.surface,seed+1));
        planet.classList.add('tex');
      }catch{}
    },30+i*40));

    /* ----- Orbit geometry ----- */
    let geo={cx:0,cy:0,rx:0,ry:0};
    function measure(){
      const w=stage.clientWidth,h=stage.clientHeight,mobile=w<560;
      const P=mobile?Math.round(Math.max(128,Math.min(168,h*.54))):Math.round(Math.max(180,Math.min(250,h*.58)));
      root.style.setProperty('--planet',P+'px');
      geo.cx=w/2;
      geo.rx=Math.min(w*(mobile?.36:.34),mobile?380:380+(P-180)*1.6);
      geo.ry=mobile?Math.max(34,h*.14):Math.max(58,h*.19);
      geo.cy=h*(mobile?.43:.41);
      orbits.forEach(o=>Object.assign(o.style,{left:(geo.cx-geo.rx)+'px',top:(geo.cy-geo.ry)+'px',width:geo.rx*2+'px',height:geo.ry*2+'px'}));
      const navY=geo.cy+'px';
      Object.assign($('#prev').style,{left:Math.max(28,geo.cx-geo.rx-130)+'px',top:navY});
      Object.assign($('#next').style,{left:Math.min(w-28,geo.cx+geo.rx+130)+'px',top:navY});
    }
    const step=N>=3?2*Math.PI/N:(N===2?1.25:0);
    const wrap=d=>{d=((d%N)+N)%N;return d>N/2?d-N:d};

    let rot=0,active=-1,target=0;
    function render(){
      bodies.forEach((el,i)=>{
        const th=wrap(i-rot)*step;
        const depth=(Math.cos(th)+1)/2;
        const x=geo.cx+geo.rx*Math.sin(th),y=geo.cy+geo.ry*Math.cos(th);
        const s=.38+.62*Math.pow(depth,1.6);
        el.style.transform='translate('+(x-el.offsetWidth/2)+'px,'+(y-el.offsetHeight/2)+'px) scale('+s.toFixed(3)+')';
        el.style.opacity=(.35+.65*depth).toFixed(3);
        el.style.zIndex=String(Math.round(depth*100));
        el.style.filter=depth<.95?'saturate('+(.7+.3*depth).toFixed(2)+') brightness('+(.75+.25*depth).toFixed(2)+')':'';
      });
    }
    const infoHTML=s=>{
      const locked=s.status==='soon';
      return '<h2>'+esc(s.title)+'</h2>'+
        (locked?'<p class="soon-note">'+(elOf(s)?'<span class="el-tag">'+elOf(s).emoji+' ดาว'+elOf(s).name+'</span> · ':'')+'ครูกำลังเตรียมบทเรียน</p>':'')+
        (s.theme?'<p class="theme">✦ '+esc(s.theme)+'</p>':'')+
        (!locked&&(s.meta||elOf(s))?'<div class="meta">'+(elOf(s)?'<span class="el-tag">'+elOf(s).emoji+' ดาว'+elOf(s).name+'</span>':'')+(s.meta||[]).map(m=>'<span>'+esc(m)+'</span>').join('')+(monOf(s)?.name?'<span class="mon-name">👾 '+esc(monOf(s).name)+'</span>':'')+'</div>':'')+
        (locked?'<span class="go soon"><i data-lucide="lock"></i>เร็ว ๆ นี้</span>':'<a class="go" href="'+link(s.url)+'" '+ext+'><i data-lucide="play"></i>เข้าเรียน</a>');
    };
    const sayText=s=>s.say||(s.status==='soon'?'ดาว'+s.title+'ยังสำรวจไม่ได้นะ ครูกำลังเตรียมอยู่':'ดาว'+s.title+'พร้อมแล้ว! กด “เข้าเรียน” ได้เลย');

    // Keep the layout still: reserve the height of the tallest subject's info
    // (and of the header with the longest speech bubble) so nothing below jumps.
    function lockHeights(){
      const info=$('#info'),say=$('#say'),who=$('.who');
      const keepInfo=info.innerHTML,keepSay=say.textContent;
      info.style.minHeight='';who.style.minHeight='';
      let hi=0,hw=0;
      SUBJECTS.forEach(s=>{
        info.innerHTML=infoHTML(s);hi=Math.max(hi,info.offsetHeight);
        say.textContent=sayText(s);hw=Math.max(hw,who.offsetHeight);
      });
      info.innerHTML=keepInfo;say.textContent=keepSay;
      info.style.minHeight=hi+'px';who.style.minHeight=hw+'px';
      icons();
    }

    function setActive(i){
      if(i===active)return;
      active=i;
      const s=SUBJECTS[i],locked=s.status==='soon';
      bodies.forEach((el,k)=>{el.classList.toggle('active',k===i);el.setAttribute('aria-current',String(k===i))});
      picks.forEach((p,k)=>p.setAttribute('aria-selected',String(k===i)));
      // keep the chosen chip visible when the chip row scrolls (mobile); scrolls the row only
      const pk=picks[i];
      if(picker.scrollWidth>picker.clientWidth)picker.scrollTo({left:pk.offsetLeft-(picker.clientWidth-pk.offsetWidth)/2,behavior:'auto'});
      root.style.setProperty('--c',colorOf(s));
      const info=$('#info');
      info.innerHTML=infoHTML(s);
      info.classList.remove('swap');void info.offsetWidth;info.classList.add('swap');
      const say=$('#say');
      say.textContent=sayText(s);
      say.classList.remove('pop');void say.offsetWidth;say.classList.add('pop');
      icons();
      const mon=bodies[i].querySelector('.monster');
      if(mon&&!locked){clearTimeout(setActive.t);mon.dataset.busy='1';setFrame(mon,6);setActive.t=setTimeout(()=>{delete mon.dataset.busy;setFrame(mon,0)},1300)}
      setTechno(locked?'soon':'open');
    }
    const setFrame=(el,f)=>{el.style.backgroundPosition=(f%3)*50+'% '+Math.floor(f/3)*50+'%'};
    let technoPose='';
    function setTechno(pose){
      const img=$('#techno');if(!img||technoPose===pose)return;technoPose=pose;
      loadDrive(TECHNO_POSES[pose],320,src=>{if(technoPose!==pose)return;img.src=src;img.hidden=false;img.classList.remove('swap');void img.offsetWidth;img.classList.add('swap')});
    }

    /* ----- Animation: rotate along the arc (with a fallback if frames are throttled) ----- */
    let raf=0,fallback=0;
    function animate(){
      cancelAnimationFrame(raf);clearTimeout(fallback);
      if(reduce){rot=target;render();return}
      const tick=()=>{
        const d=wrap(target-rot);
        if(Math.abs(d)<.002){rot=target;render();return}
        rot+=d*.16;render();raf=requestAnimationFrame(tick);
      };
      raf=requestAnimationFrame(tick);
      fallback=setTimeout(()=>{if(Math.abs(wrap(target-rot))>.01){cancelAnimationFrame(raf);rot=target;render()}},900);
    }
    function go(i){target=((i%N)+N)%N;setActive(target);animate()}

    $('#prev').addEventListener('click',e=>{e.stopPropagation();go(active-1)});
    $('#next').addEventListener('click',e=>{e.stopPropagation();go(active+1)});
    picks.forEach(p=>p.addEventListener('click',()=>go(+p.dataset.i)));
    bodies.forEach(el=>el.addEventListener('click',()=>{if(!dragMoved)go(+el.dataset.i)}));
    stage.addEventListener('keydown',e=>{
      if(e.key==='ArrowRight'){e.preventDefault();go(active+1)}
      else if(e.key==='ArrowLeft'){e.preventDefault();go(active-1)}
    });

    // Drag / swipe to spin the orbit
    let drag=null,dragMoved=false;
    stage.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('.nav'))return;
      drag={x:e.clientX,y:e.clientY,rot,id:e.pointerId};dragMoved=false;
    });
    stage.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!dragMoved){
        if(Math.abs(dx)<8)return;
        if(Math.abs(dy)>Math.abs(dx)){drag=null;return} // vertical: let the page scroll
        dragMoved=true;stage.classList.add('dragging');stage.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);
      }
      rot=drag.rot-dx/(geo.rx*step*.9);render();
      const i=((Math.round(rot)%N)+N)%N;if(i!==active)setActive(i);
    });
    const end=()=>{
      if(!drag)return;drag=null;
      if(dragMoved){stage.classList.remove('dragging');go(Math.round(rot));setTimeout(()=>{dragMoved=false},0)}
    };
    stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);

    function icons(){try{window.lucide?.createIcons({attrs:{'aria-hidden':'true','focusable':'false'}})}catch{}}
    function relayout(){lockHeights();measure();render()}
    addEventListener('resize',relayout);

    // First visit on a touch screen: show a short "swipe" hint once
    (()=>{
      if(!matchMedia('(pointer: coarse)').matches||reduce)return;
      let seen=false;try{seen=localStorage.getItem('kk-swipe-hint')==='1'}catch{}
      if(seen)return;
      const hint=$('#swipe-hint');hint.hidden=false;
      const hide=()=>{hint.classList.add('out');setTimeout(()=>{hint.hidden=true},450);try{localStorage.setItem('kk-swipe-hint','1')}catch{}};
      setTimeout(hide,2600);stage.addEventListener('pointerdown',hide,{once:true});
    })();

    measure();
    const first=Math.max(0,SUBJECTS.findIndex(s=>s.status!=='soon'));
    rot=target=first;setActive(first);relayout();
    document.fonts?.ready.then(relayout);

    const [y,m,d]=UPDATED.split('-').map(Number),t=$('#updated');
    t.dateTime=UPDATED;
    try{t.textContent=new Date(y,m-1,d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch{t.textContent=UPDATED}

    const s=document.createElement('script');
    s.src='https://unpkg.com/lucide@1.44.0/dist/umd/lucide.min.js';s.async=true;
    s.onload=()=>{icons();relayout()};
    document.head.appendChild(s);
  </script>
  <script>
    // AI Disclosure popup: SweetAlert2 is loaded only when the button is first clicked
    (()=>{
      const btn=document.getElementById('ai-btn'),tpl=document.getElementById('ai-note-tpl');
      if(!btn||!tpl)return;
      const title='🤖 การประกาศการใช้ปัญญาประดิษฐ์';
      const fallback=()=>{const o=document.createElement('div');o.className='ai-fallback';o.setAttribute('role','dialog');o.innerHTML='<div class="ai-popup"><h2 class="swal2-title">'+title+'</h2>'+tpl.innerHTML+'<button type="button">รับทราบ</button></div>';o.addEventListener('click',e=>{if(e.target===o||e.target.tagName==='BUTTON')o.remove()});document.body.appendChild(o);o.querySelector('button').focus()};
      const show=()=>Swal.fire({title,html:tpl.innerHTML,width:640,background:'#0b0f28',color:'#e9f2ff',confirmButtonText:'รับทราบ',confirmButtonColor:'#4ef4d2',customClass:{popup:'ai-popup',confirmButton:'ai-ok'},backdrop:'rgba(3,4,12,.72)',heightAuto:false,scrollbarPadding:false});
      let loading=null;
      btn.addEventListener('click',()=>{
        if(window.Swal)return show();
        loading=loading||new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)});
        loading.then(show).catch(()=>{loading=null;fallback()});
      });
    })();
  </script>
</body>
</html>
