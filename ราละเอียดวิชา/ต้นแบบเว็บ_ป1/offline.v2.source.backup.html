<header><div class="brand">KruKan<span> / </span>TECHNO</div><div class="header-right"><span class="pill">ป.1 · ภารกิจกู้ดาวสายฟ้า</span><button class="quiet hidden" id="account-btn"></button><button class="quiet" id="help-btn">วิธีเล่น</button><button class="secondary" id="teacher-btn">สำหรับครู</button></div></header>

<script>

let step=0,order=[],hintLevel=0,feedback=null,lessonOpen=false;

 before:{title:'ช่วยปลูกต้นไม้ให้สถานี',goal:'เรียงภาพการปลูกต้นไม้ จากเริ่มต้นจนเสร็จ',cards:[['soil','🪴','ใส่ดินในกระถาง'],['hole','🕳️','ทำหลุมในดิน'],['seed','🌱','วางเมล็ดในหลุม'],['water','💧','กลบดินแล้วรดน้ำ']],shuffle:['seed','soil','water','hole']},

 challenge:{title:'บอสทำขั้นตอนล้างมือสลับกัน!',goal:'เรียงภาพการล้างมือ จากเริ่มต้นจนเสร็จ',cards:[['wet','🚰','เปิดน้ำให้มือเปียก'],['soap','🧼','ถูมือด้วยสบู่'],['rinse','💦','ล้างสบู่ออก'],['dry','🧻','เช็ดมือให้แห้ง']],shuffle:['dry','soap','wet','rinse']}
};

function persist(){if(!currentRider)return;try{StudentRepository.save(currentRider.id,state);storageOK=true}catch(e){storageOK=false}const status=$('#save-status');if(status){status.textContent=storageOK?'✓ บันทึกอัตโนมัติ':'บันทึกไม่ได้ · แจ้งครู';status.classList.toggle('failed',!storageOK)}}

function footer(){return '<span id="save-status" class="save-status-pill">'+(storageOK?'✓ บันทึกอัตโนมัติ':'บันทึกไม่ได้ · แจ้งครู')+'</span><div class="footer"><span>ต้นแบบออฟไลน์ · หน่วย 2 เล่นได้ · หน่วยอื่นเป็นโครงร่าง</span><span>ข้อมูลทดลองเก็บในเครื่องนี้ · ไม่มีการส่งข้อมูลขึ้น GAS</span></div>'}
function renderMap(){if(!currentRider)return renderLogin();stopBattle();$('#app').classList.remove('battle-mode','preview-mode');lessonOpen=false;$('#app').innerHTML=`
 <section class="hero"><div class="hero-copy"><div class="eyebrow">ภารกิจนักสำรวจ · วิทยาการคำนวณ ป.1</div><h1>ช่วย Techno<br>กู้ดาวสายฟ้า!</h1><p>บอสขโมยพลังของดาวไปแล้ว!<br>มาคิด ทดลอง และแก้ปัญหา เพื่อคืนแสงให้ทั้ง 9 สถานี</p><div class="actions"><button class="primary" id="start-btn">${state.lesson&&state.lesson.step>0&&state.lesson.step<8?'▶ เล่นภารกิจต่อ':state.complete?'↻ เล่นหน่วย 2 อีกครั้ง':'▶ เริ่มภารกิจหน่วย 2'}</button><span class="small muted">ลองคิดเอง แล้วค่อยขอคำใบ้</span></div></div><div class="hero-art" aria-hidden="true"><div class="planet"></div><span class="bolt">ϟ</span><img class="hero-ship" src="${ASSETS.ship}" alt=""><span class="hero-tag">ดาวสายฟ้า · GOLDEN PARASITE</span></div></section>
 <div class="section-heading"><div><h2>แผนที่ภารกิจ</h2><p class="small muted">เลือกสถานีเพื่อดูว่าจะได้เรียนรู้อะไร</p></div><span class="pill">แกนพลัง ${state.complete?1:0} / 9</span></div>
 <div class="map">${CURRICULUM.units.map((u,i)=>`<button class="station ${i===1?'active':''}" data-unit="${i}"><div class="station-number"><b>0${i+1}</b><span class="station-icon" aria-hidden="true">${icons[i]}</span></div><h3>${missions[i]}</h3><p>${esc(u.new)}</p><span class="station-status ${i===1&&state.complete?'done':''}">${i===1?(state.complete?'✓ ทำภารกิจสำเร็จ · เล่นซ้ำได้':'▶ พร้อมให้ลองเล่น'):'ดูแผนการเรียนรู้ ↗'}</span></button>`).join('')}</div>
 <section class="boss-panel"><div class="sprite" role="img" aria-label="บอส Golden Parasite"></div><div><div class="eyebrow" style="margin-bottom:4px">เป้าหมายของนักสำรวจ</div><h3>คืนพลังให้ดาวสายฟ้า</h3><p>แต่ละหน่วยได้ทักษะใหม่ ก่อนรวมพลังในภารกิจสุดท้าย</p></div><span class="pill">คิด · ทดลอง · อธิบาย</span></section>${footer()}`;
 const preview=document.createElement('section');preview.className='minigame-entry';preview.innerHTML='<div><h3>ลองมินิเกมหลังภารกิจ</h3><p>ตัวอย่างการต่อสู้ · เข้าตรงนี้เพื่อดูรูปแบบเกมได้</p></div><button class="secondary" id="battle-preview">⚡ ลองสู้มอนสเตอร์</button>';document.querySelector('.boss-panel').after(preview);$('#battle-preview').onclick=()=>{battlePreview=true;step=7;renderLesson();window.scrollTo(0,0)};$('#start-btn').onclick=resumeLesson;document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.unit);i===1?startLesson():unitInfo(i)})}
function modal(html){pauseBattle();$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><h2 id="dialog-title">${html.title}</h2><button class="close" aria-label="ปิดหน้าต่าง">×</button></div>${html.body}</section></div>`;const close=$('.close');close.onclick=closeModal;$('.modal-backdrop').onclick=e=>{if(e.target===$('.modal-backdrop'))closeModal()};modal.lastFocus=document.activeElement;close.focus()}
function closeModal(){const focus=modal.lastFocus;$('#modal-root').innerHTML='';if(focus&&focus.isConnected)focus.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){const els=[...$('.modal').querySelectorAll('button,input,select,a[href]')].filter(e=>!e.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
function unitInfo(i){const u=CURRICULUM.units[i];modal({title:`หน่วย ${i+1} · ${missions[i]}`,body:`<p class="eyebrow" style="color:#705094">${esc(u.new)}</p><p>เทียบคู่มือ สสวท.: <b>${esc(u.old)}</b></p><h3>เมื่อเรียนแล้ว ฉันจะทำได้</h3><ul>${u.obj.map(o=>'<li>'+esc(o)+'</li>').join('')}</ul><div class="note"><b>ชิ้นงานของหน่วย</b><br>${esc(u.task)}</div><p class="small muted" style="margin-top:18px">หน่วยนี้แสดงโครงร่างสำหรับพัฒนาต่อ กิจกรรมที่เล่นได้ในต้นแบบคือหน่วย 2</p><button class="primary" id="try-unit">ลองเล่นหน่วย 2</button>`});$('#try-unit').onclick=()=>{closeModal();startLesson()}}
function startLesson(){battlePreview=false;step=0;order=[];hintLevel=0;feedback=null;renderLesson();window.scrollTo(0,0)}
const stepLabels=['คิดก่อนเรียน','รับภารกิจ','ดูวิธีคิด','ฝึกและทดลอง','ทำกับเพื่อน','ภารกิจใหม่','สะท้อนคิด','สู้มอนสเตอร์','รับแกนพลัง'];
function taskForStep(){return step===0?'before':step===3?'practice':step===5?'challenge':null}
function renderLesson(){if(!currentRider)return renderLogin();stopBattle();if(!battlePreview){state.lesson={step,order:[...order],hintLevel};persist()}lessonOpen=true;const kind=taskForStep();const guideText=step===0?'ลองคิดเองก่อนนะ ยังไม่ต้องขอคำใบ้ ครูจะดูว่าเราเริ่มต้นอย่างไร':step===3?'คิดก่อนว่าอะไรต้องทำก่อน ลองจัดแล้วกดทดลอง ถ้าติดขัดขอคำใบ้ได้':step===5?'ใช้วิธีคิดที่ฝึกมา ทำโจทย์ใหม่นี้ด้วยตัวเอง แล้วเล่าให้ครูฟัง':step===4?'วางบัตรภาพกับเพื่อน สลับกันเป็นผู้วางแผนและผู้ทำตาม':'ถามตัวเองว่า “อะไรต้องทำก่อน แล้วอะไรตามมา?”';
 $('#app').innerHTML=`<div class="lesson-top"><button class="quiet" id="map-btn">← กลับแผนที่</button><span class="step-caption">${battlePreview?'สนามฝึก · ผลเกมแยกจากบทเรียน':'หน่วย 2 · ขั้น '+(step+1)+' จาก '+stepLabels.length}</span></div><div class="step-track" aria-label="ขั้น ${step+1} จาก ${stepLabels.length}">${stepLabels.map((_,i)=>`<span class="step-dot ${i<step?'complete':i===step?'current':''}"></span>`).join('')}</div><div class="lesson-heading"><div><div class="eyebrow">${stepLabels[step]}</div><h1>เปิดประตูสถานีสายฟ้า</h1><p class="step-caption">ฉันเรียงขั้นตอนด้วยภาพ ให้ผู้อื่นทำตามได้</p></div><span class="pill">คิด · เรียง · ทดลอง</span></div><div class="lesson-layout"><section class="playfield" id="playfield">${kind?taskUI(kind):stageUI()}</section><aside class="guide"><img src="${ASSETS.techno}" alt="Techno ผู้ช่วยนักสำรวจ"><div><h3>Techno ชวนคิด</h3><p>${guideText}</p>${step===3?'<button class="quiet" id="hint-btn">✦ ขอคำใบ้</button>':''}</div></aside></div>${footer()}`;
 $('#app').classList.toggle('battle-mode',step===7);$('#app').classList.toggle('preview-mode',battlePreview);
 $('#map-btn').onclick=renderMap;if(kind)bindTask(kind);else bindStage();if($('#hint-btn'))$('#hint-btn').onclick=showHint;
 const focus=$('#playfield h2');if(focus){focus.tabIndex=-1;focus.focus({preventScroll:true})}}
function card(c){return `<span class="card-icon" aria-hidden="true">${c[1]}</span><span class="card-title">${c[2]}</span>`}
function taskUI(kind){const t=tasks[kind];return `<h2>${t.title}</h2><p class="muted">${t.goal}</p><p class="order-note">แตะภาพเพื่อวางในช่องถัดไป · แตะภาพในช่องเพื่อนำออก</p><div class="order-slots">${[0,1,2,3].map(i=>{const c=t.cards.find(c=>c[0]===order[i]);return `<button class="slot ${c?'filled':''}" data-slot="${i}" aria-label="ช่อง ${i+1}${c?' '+c[2]+' แตะเพื่อนำออก':''}"><span class="num">ขั้น ${i+1}</span>${c?card(c):'<span style="font-size:26px">＋</span><span class="small">วางภาพ</span>'}</button>`}).join('')}</div><p class="bank-label">ภาพที่เลือกได้</p><div class="bank">${t.shuffle.map(id=>{const c=t.cards.find(c=>c[0]===id);return `<button class="choice ${order.includes(id)?'used':''}" data-card="${id}" ${order.includes(id)?'disabled':''} aria-label="เลือก ${c[2]}">${card(c)}</button>`}).join('')}</div>${feedback?`<div class="feedback ${feedback.good?'good':''}" role="status"><strong>${feedback.title}</strong><p>${feedback.text}</p></div>`:''}<div class="play-actions"><button class="secondary" id="clear-order">↻ จัดใหม่</button>${feedback&&feedback.good?'<button class="primary" id="next-step">ไปต่อ →</button>':`<button class="primary" id="submit-order" ${order.length<4?'disabled':''}>${kind==='practice'?'▶ ทดลองลำดับ':'ส่งลำดับของฉัน →'}</button>`}</div>`}
function bindTask(kind){document.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(order.length>=4)return;order.push(b.dataset.card);feedback=null;refreshTask(kind)});document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.slot);if(order[i]){order.splice(i,1);feedback=null;refreshTask(kind)}});$('#clear-order').onclick=()=>{order=[];feedback=null;refreshTask(kind)};if($('#submit-order'))$('#submit-order').onclick=()=>submitOrder(kind);if($('#next-step'))$('#next-step').onclick=nextStep}
function refreshTask(kind){state.lesson={step,order:[...order],hintLevel};persist();$('#playfield').innerHTML=taskUI(kind);bindTask(kind)}
function submitOrder(kind){if(order.length!==4)return;const t=tasks[kind];const correct=order.every((id,i)=>id===t.cards[i][0]);const firstWrong=order.findIndex((id,i)=>id!==t.cards[i][0]);state.attempts.push({unit:2,kind,order:[...order],correct,points:order.filter((id,i)=>id===t.cards[i][0]).length,maxPoints:4,hints:hintLevel,at:new Date().toISOString()});persist();
 if(kind==='before'){nextStep();return}
 if(kind==='challenge'){state.lastChallengeCorrect=correct;persist();nextStep();return}
 feedback=correct?{good:true,title:'✓ สถานีได้รับพลังแล้ว!',text:'ลำดับนี้ทำตามได้ ลองชี้ภาพแล้วเล่าว่าเหตุใดจึงเรียงแบบนี้'}:{good:false,title:'ลองตรวจลำดับอีกครั้ง',text:`ดูขั้น ${firstWrong+1} ว่าพร้อมทำสิ่งนี้หรือยัง ต้องทำอะไรให้เสร็จก่อน? แตะภาพเพื่อนำออกแล้วจัดใหม่ได้`};refreshTask(kind)}
function nextStep(){step++;order=[];hintLevel=0;feedback=null;renderLesson();window.scrollTo(0,0)}
function showHint(){hintLevel=Math.min(hintLevel+1,3);state.hintCount++;persist();const hints=['ดูภาพเครื่องส่งพลัง ก่อนเปิดเครื่องต้องใส่อะไรเข้าไป?','ลองหาบัตรที่เป็นการเตรียมของ ก่อนนำไปใส่เครื่อง','ตัวอย่าง: หยิบหนังสือ → ใส่กระเป๋า → ปิดกระเป๋า → ยกกระเป๋า ลองใช้วิธีคิดนี้กับเครื่องส่งพลัง'];feedback={good:false,title:`✦ คำใบ้ขั้น ${hintLevel}`,text:hints[hintLevel-1]};refreshTask('practice')}
function stageUI(){if(step===1)return `<h2>ประตูสถานีเปิดไม่ออก!</h2><div class="story-scene"><div class="sprite" role="img" aria-label="Golden Parasite"></div><p>บอสทำขั้นตอนของสถานีสลับกัน<br>ช่วย Techno เรียงใหม่ให้ทำงานได้</p></div><p>วันนี้เราจะฝึกดูว่า <b>อะไรต้องทำก่อน และอะไรตามมา</b></p><div class="play-actions"><span class="small muted">ครูเล่าเรื่องและถามความคิดเด็ก</span><button class="primary" id="next-step">ไปเรียนรู้กัน →</button></div>`;
 if(step===2){const model=[['📗','หยิบหนังสือ'],['🎒','ใส่ในกระเป๋า'],['🔒','ปิดกระเป๋า'],['🙋','ยกกระเป๋า']];return `<h2>คิดทีละขั้น ก่อนลงมือทำ</h2><p class="muted">ลองดูตัวอย่างเตรียมกระเป๋าของ Techno</p><div class="model-row">${model.map((c,i)=>`<div class="model-card"><span class="small">ขั้น ${i+1}</span><span class="card-icon" aria-hidden="true">${c[0]}</span><b class="card-title">${c[1]}</b></div>`).join('')}</div><div class="feedback"><strong>ถ้าปิดกระเป๋าก่อนใส่หนังสือ จะเกิดอะไรขึ้น?</strong><p>ชี้ภาพและลองเล่าให้เพื่อนฟัง ครูสาธิตให้เห็นผล แล้วชวนเด็กหาลำดับที่ทำตามได้</p></div><div class="play-actions"><span class="small muted">ดูตัวอย่าง → คาดการณ์ → อธิบาย</span><button class="primary" id="next-step">ลองทำเอง →</button></div>`}
 if(step===4)return `<h2>ออกจากจอ มาลองกับเพื่อน</h2><div class="story-scene"><span style="font-size:68px" aria-hidden="true">🧑‍🤝‍🧑</span><p>คนหนึ่งเรียงบัตร<br>อีกคนลองทำตาม</p></div><ol class="checklist"><li>วาดหรือใช้บัตรภาพขั้นตอนเตรียมกระเป๋า</li><li>เพื่อนทำตามลำดับ แล้วช่วยกันตรวจ</li><li>สลับบทบาทและเล่าว่าปรับอะไร</li></ol><div class="note">ครูดูการปฏิบัติจริง ใช้ปุ่มไปต่อเมื่อทำกิจกรรมแล้ว</div><div class="play-actions"><span class="small muted">ไม่ต้องอัปโหลดภาพในต้นแบบ</span><button class="primary" id="next-step">ทำกับเพื่อนแล้ว →</button></div>`;
 if(step===6)return `<h2>เราเรียนรู้อะไรจากภารกิจนี้?</h2><p>เลือกความรู้สึกของตัวเอง แล้วเล่าวิธีคิดให้ครูฟัง</p><div class="reflection-options">${['ทำเองได้','ยังต้องฝึก','อยากให้ช่วย'].map((t,i)=>`<button data-reflect="${t}" class="${state.reflection===t?'selected':''}">${['😊','💪','🙋'][i]}<br>${t}</button>`).join('')}</div><div class="feedback"><strong>“ภาพไหนต้องมาก่อน เพราะอะไร?”</strong><p>ชี้ภาพหรือเล่าปากเปล่าได้ ครูบันทึกการอธิบายแยกจากผลเกม ความรู้สึกของเด็กไม่ใช้แทนคะแนนความสามารถ</p></div>${!state.lastChallengeCorrect?'<div class="note">โจทย์บอสยังต้องทบทวน ครูเปิดดูคำตอบได้ในหน้าสำหรับครู แล้วชวนเด็กลองอีกครั้ง</div>':''}<div class="play-actions"><button class="secondary" id="retry-challenge">ลองโจทย์ใหม่อีกครั้ง</button><button class="primary" id="finish-btn" ${!state.reflection?'disabled':''}>ไปสู้มอนสเตอร์ →</button></div>`;
 if(step===7)return battleUI();
 return `<h2>${state.complete?'ได้แกนพลังแห่งลำดับแล้ว!':'วันนี้เราได้ฝึกคิดแล้ว!'}</h2><div class="story-scene"><span style="font-size:80px" aria-hidden="true">${state.complete?'💎':'🌟'}</span><p>${state.complete?'สถานีที่ 2 กลับมาสว่างอีกครั้ง':'กลับมาฝึกโจทย์บอสใหม่ได้เสมอ'}</p></div><div class="badge-row"><div class="badge"><b>${state.complete?'✓':'○'}</b>ทำภารกิจได้</div><div class="badge"><b>${state.teacherCheck?'✓':'○'}</b>ตรวจวิธีได้<br><small>ครูยืนยัน</small></div><div class="badge"><b>${state.teacherExplain?'✓':'○'}</b>เล่าวิธีได้<br><small>ครูยืนยัน</small></div></div><p class="muted">คำตอบและการลองของเราบันทึกไว้ในเครื่องนี้ ครูดูผลทดลองได้</p><div class="play-actions"><button class="secondary" id="teacher-results">ดูผลทดลองกับครู</button><button class="primary" id="back-map">กลับแผนที่ →</button></div>`}
function bindStage(){if(step===7){bindBattle();return}if($('#next-step'))$('#next-step').onclick=nextStep;if(step===6){document.querySelectorAll('[data-reflect]').forEach(b=>b.onclick=()=>{state.reflection=b.dataset.reflect;persist();renderLesson()});$('#retry-challenge').onclick=()=>{step=5;order=[];feedback=null;renderLesson()};$('#finish-btn').onclick=()=>{state.complete=Boolean(state.lastChallengeCorrect);persist();nextStep()}}if($('#teacher-results'))$('#teacher-results').onclick=teacher;if($('#back-map'))$('#back-map').onclick=renderMap}
function teacherDetail(){const first=state.attempts.find(a=>a.kind==='before');const challenges=state.attempts.filter(a=>a.kind==='challenge');const last=challenges.at(-1);const practice=state.attempts.filter(a=>a.kind==='practice');modal({title:'ผลทดลอง · สำหรับครู',body:`<div class="note">ผลของ Rider ${currentRider.id.slice(1)} · ${esc(currentRider.name)} เก็บแยกบนเบราว์เซอร์เครื่องนี้ ต้องเชื่อม GAS จึงจะรวมผลจากหลายเครื่องได้</div><div class="scroll-table"><table class="teacher-table"><tr><th>ช่วง</th><th>ผลลำดับ</th><th>หลักฐาน</th></tr><tr><td>ก่อนเรียน</td><td>${first?(first.correct?'ตรงลำดับเป้าหมาย':'ยังไม่ตรงลำดับ'):'ยังไม่มีข้อมูล'}</td><td>คำตอบครั้งแรก</td></tr><tr><td>ระหว่างฝึก</td><td>${practice.length} ครั้ง</td><td>คำใบ้ ${state.hintCount} ครั้ง</td></tr><tr><td>โจทย์ใหม่หลังเรียน</td><td>${last?(last.correct?'ตรงลำดับเป้าหมาย':'ยังไม่ตรงลำดับ'):'ยังไม่มีข้อมูล'}</td><td>${challenges.length} ครั้ง</td></tr></table></div><p class="small muted">ผลอัตโนมัติเป็นการเทียบลำดับโจทย์ตัวอย่าง งานก่อน–หลังยังต้องตรวจความเหมาะสมและความยากกับเด็กจริงก่อนใช้รายงานประกวด</p><h3>ครูยืนยันจากการปฏิบัติ</h3><label><input type="checkbox" id="teacher-check" style="width:auto" ${state.teacherCheck?'checked':''}> เด็กตรวจลำดับหรือปรับวิธีได้</label><label><input type="checkbox" id="teacher-explain" style="width:auto" ${state.teacherExplain?'checked':''}> เด็กชี้ภาพหรือเล่าเหตุผลได้</label><p class="small">สะท้อนคิด: ${esc(state.reflection||'ยังไม่ได้ตอบ')}</p><div class="actions" style="margin-top:20px"><button class="primary" id="export-btn">ดาวน์โหลดผลทดลอง</button><button class="secondary" id="reset-btn">ล้างข้อมูลทดลอง</button></div><p class="small muted" style="margin:15px 0 0">${storageOK?'บันทึกในเบราว์เซอร์เครื่องนี้ได้':'เบราว์เซอร์ไม่อนุญาตเก็บถาวร ดาวน์โหลดผลก่อนปิดหน้า'}</p>`});$('#teacher-check').onchange=e=>{state.teacherCheck=e.target.checked;persist();if(lessonOpen&&step===8)renderLesson()};$('#teacher-explain').onchange=e=>{state.teacherExplain=e.target.checked;persist();if(lessonOpen&&step===8)renderLesson()};$('#export-btn').onclick=()=>{const blob=new Blob([JSON.stringify({prototype:true,riderId:currentRider.id,name:currentRider.name,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Techno-P1-'+currentRider.id+'-ผลทดลอง.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('ดาวน์โหลดข้อมูลทดลองแล้ว')};$('#reset-btn').onclick=()=>{if(!confirm('ล้างข้อมูลทดลองในเบราว์เซอร์นี้?'))return;state=blankState();persist();closeModal();renderMap();toast('ล้างข้อมูลทดลองแล้ว')}}
$('#teacher-btn').onclick=teacher;
$('#help-btn').onclick=()=>modal({title:'วิธีเล่นกับ Techno',body:'<ol class="checklist"><li>เลือกหน่วย 2 หรือกดเริ่มภารกิจ</li><li>แตะภาพเพื่อเรียงจากซ้ายไปขวา ขั้น 1 ถึง 4</li><li>แตะภาพในช่องเพื่อนำออก แล้วจัดใหม่ได้</li><li>กดทดลอง ดูผล และขอคำใบ้ระหว่างฝึก</li><li>ทำกิจกรรมกับเพื่อน แล้วกลับมาทำโจทย์ใหม่ด้วยตัวเอง</li></ol><div class="note">ต้นแบบนี้ใช้ได้โดยไม่ต่ออินเทอร์เน็ต ภาพอยู่ในไฟล์ ไม่มีเสียงอ่านในรุ่นนี้ ครูอ่านคำสั่งให้เด็กฟังได้</div>'});
