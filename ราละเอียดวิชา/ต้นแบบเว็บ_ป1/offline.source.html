function modal(html){pauseBattle();pauseSkillGame();$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head"><h2 id="dialog-title">${html.title}</h2><button class="close" aria-label="ปิดหน้าต่าง">×</button></div>${html.body}</section></div>`;const close=$('.close');close.onclick=closeModal;$('.modal-backdrop').onclick=e=>{if(e.target===$('.modal-backdrop'))closeModal()};modal.lastFocus=document.activeElement;close.focus()}
function closeModal(){const focus=modal.lastFocus;$('#modal-root').innerHTML='';if(focus&&focus.isConnected)focus.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.modal')){const els=[...$('.modal').querySelectorAll('button,input,select,a[href]')].filter(e=>!e.disabled);if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
function unitInfo(i){const u=CURRICULUM.units[i];modal({title:`หน่วย ${i+1} · ${missions[i]}`,body:`<p class="eyebrow" style="color:#705094">${esc(u.new)}</p><p>เทียบคู่มือ สสวท.: <b>${esc(u.old)}</b></p><h3>เมื่อเรียนแล้ว ฉันจะทำได้</h3><ul>${u.obj.map(o=>'<li>'+esc(o)+'</li>').join('')}</ul><div class="note"><b>ชิ้นงานของหน่วย</b><br>${esc(u.task)}</div><p class="small muted" style="margin-top:18px">หน่วยนี้แสดงโครงร่างสำหรับพัฒนาต่อ กิจกรรมที่เล่นได้ในต้นแบบคือหน่วย 2</p><button class="primary" id="try-unit">ลองเล่นหน่วย 2</button>`});$('#try-unit').onclick=()=>{closeModal();startLesson()}}

cherExplain=e.target.checked;persist();if(lessonOpen&&step===lessonRoute.length-1)renderLesson()};$('#export-btn').onclick=()=>{const blob=new Blob([JSON.stringify({prototype:true,riderId:currentRider.id,name:currentRider.name,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Techno-P1-'+currentRider.id+'-ผลทดลอง.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('ดาวน์โหลดข้อมูลทดลองแล้ว')};$('#reset-btn').onclick=()=>{if(!confirm('ล้างข้อมูลทดลองในเบราว์เซอร์นี้?'))return;state=blankState();persist();closeModal();renderMap();toast('ล้างข้อมูลทดลองแล้ว')}}
