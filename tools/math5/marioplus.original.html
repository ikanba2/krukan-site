    <style>
        body {
            font-family: 'IBM Plex Sans Thai', sans-serif;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB, #B2FFFF); /* Sky background */
            border-radius: 0.75rem;
            border: 2px solid #334155; /* border-slate-700 */
        }
        .text-glow-cyan { text-shadow: 0 0 8px rgba(34, 211, 238, 0.8); }
        .text-glow-yellow { text-shadow: 0 0 8px rgba(250, 204, 21, 0.9); }
        
        #damage-flash {
            transition: opacity 0.1s ease-in-out;
        }

        .char-option {
            font-size: 3rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 3px solid transparent;
            transition: all 0.2s ease;
            line-height: 1;
        }
        .char-option:hover {
            transform: scale(1.1);
            background-color: rgba(255, 255, 255, 0.1);
        }
        .char-option.selected {
            border-color: #22d3ee; /* cyan-400 */
            transform: scale(1.1);
            background-color: rgba(34, 211, 238, 0.2);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        #overlay-title {
            animation: float 4s ease-in-out infinite;
        }

                    ctx.strokeStyle = '#67e8f9';
                    ctx.lineWidth = 3;

                    ctx.stroke();
                }
            }
            update() {
                if(keys['ArrowRight']) {
                    this.velocityX += PLAYER_MOVE_SPEED; this.direction = 1;
                }
                if(keys['ArrowLeft']) {
                    this.velocityX -= PLAYER_MOVE_SPEED; this.direction = -1;
                }
                
                this.velocityX *= FRICTION;
                if (Math.abs(this.velocityX) > PLAYER_MAX_SPEED) {
                    this.velocityX = PLAYER_MAX_SPEED * Math.sign(this.velocityX);
                }
                this.x += this.velocityX;

                pipes.forEach(pipe => {
                    if (checkCollision(this, pipe)) {
                        if (this.velocityX > 0 && this.x + this.width > pipe.x) {
                             this.x = pipe.x - this.width; this.velocityX = 0;
                        } else if (this.velocityX < 0 && this.x < pipe.x + pipe.width) {
                            this.x = pipe.x + pipe.width; this.velocityX = 0;
                        }
                    }
                });

                this.velocityY += GRAVITY;
                this.y += this.velocityY;

                let onPlatform = false;
                pipes.forEach(pipe => {
                    const isHorizontallyAligned = this.x + this.width > pipe.x + 5 && this.x < pipe.x + pipe.width - 5;
                    const isFallingOnto = this.velocityY > 0 && (this.y + this.height) >= pipe.y && (this.y + this.height - this.velocityY) <= pipe.y;
                    if(isHorizontallyAligned && isFallingOnto) {
                        this.y = pipe.y - this.height;
                        this.velocityY = 0; onPlatform = true;
                    }
                });
                
                if (!onPlatform && this.y + this.height > GROUND_Y) {
                    this.y = GROUND_Y - this.height; this.velocityY = 0;
                }

                if (this.x < cameraX) this.x = cameraX;
                 if (worldState === 'pipe' && this.x + this.width > canvas.width) {
                    this.x = canvas.width - this.width;
                }
            }
            jump() {
                if (this.velocityY === 0) { this.velocityY = -15; technoTone('jump'); }
            }
        }
        
        class Obstacle { 
            constructor(x) {
                this.width = 40 + Math.random() * 20; this.height = 40 + Math.random() * 20; this.x = x;
                this.y = GROUND_Y - this.height; this.character = Math.random() > 0.5 ? '🌵' : '🪨';
            }
            draw() { ctx.font = '48px serif'; ctx.fillText(this.character, this.x, this.y + this.height); }
        }

        class Treasure {
            constructor(x) {
                this.width = 50; this.height = 50; this.x = x;
                this.y = GROUND_Y - this.height - (Math.random() > 0.5 ? 0 : 80); this.character = '💎';
            }
            draw() { ctx.font = '48px serif'; ctx.fillText(this.character, this.x, this.y + this.height); }
        }

        class Collectible {
            constructor(x, y = GROUND_Y - 30 - (Math.random() * 60)) {
                this.width = 20; this.height = 20; this.x = x;
                this.y = y; this.character = '🪙';
            }
            draw() { ctx.font = '24px serif'; ctx.fillText(this.character, this.x, this.y + this.height); }
            update(player) {
                if (player && player.buffs.magnet) {
                    const magnetStrength = 7; const playerCenterX = player.x + player.width / 2; const playerCenterY = player.y + player.height / 2;
                    const dx = playerCenterX - this.x; const dy = playerCenterY - this.y; const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 200) {
                        const vx = (dx / distance) * magnetStrength; const vy = (dy / distance) * magnetStrength;
                        this.x += vx; this.y += vy;
                    }
                }
            }
        }
        
        class Monster {
            constructor(x) {
                this.width = 50; this.height = 40; this.x = x;
                this.y = GROUND_Y - this.height; this.character = '🐢';
                this.vx = -(1 + Math.random() * 1);
                this.direction = -1;
            }
            draw() { 
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.scale(this.direction, 1);
                ctx.font = '40px serif';
                ctx.fillText(this.character, this.direction === 1 ? 0 : -this.width, this.height);
                ctx.restore();
            }
            update() {
                this.x += this.vx;
                const collisionObjects = [...obstacles, ...pipes];
                collisionObjects.forEach(obj => {
                    if (checkCollision(this, obj)) {
                        this.vx *= -1; this.direction *= -1;
                    }
                });
            }
        }

        class Pipe {
            constructor(x, isEnterable = false) {
                this.width = 60; this.height = 80; this.x = x;
                this.y = GROUND_Y - this.height; this.isEnterable = isEnterable; this.isExit = false;
            }
            draw() {
                ctx.fillStyle = this.isEnterable ? '#22c55e' : '#16a34a';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = '#15803d';
                ctx.fillRect(this.x - 5, this.y, this.width + 10, 20);
            }
        }
        
        class Cloud {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = 20 + Math.random() * 100;
                this.radius = 20 + Math.random() * 20;
                this.speed = 0.2 + Math.random() * 0.3;
            }
            draw() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.arc(this.x + this.radius * 0.8, this.y - this.radius * 0.5, this.radius * 0.8, 0, Math.PI * 2);
                ctx.arc(this.x + this.radius * 1.5, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                this.x -= this.speed;
                if (this.x + this.radius * 2.5 < cameraX) {
                    this.x = cameraX + canvas.width;
                }
            }
        }

        // === Core Game Logic ===
        function init() {
            gameState = 'playing'; worldState = 'main';
            player = new Player();
            obstacles = []; treasures = []; collectibles = []; activeBuffs = []; monsters = []; pipes = []; clouds = [];
            for (let i = 0; i < 5; i++) clouds.push(new Cloud());
            lives = 3; score = 0; level = 1; frameCount = 0; cameraX = 0;
            worldmaxX = canvas.width;
            overlay.style.backgroundColor = 'transparent'; startEndScreen.style.display = 'none'; problemScreen.style.display = 'none';
            updateUI(); gameLoop();
        }

        function gameLoop() {
            if (gameState === 'gameOver' || gameState === 'paused') return;
            update(); draw(); frameCount++;
            requestAnimationFrame(gameLoop);
        }

        function update() {
            player.update();
            if (worldState === 'main') updateMainWorld();
            else if (worldState === 'pipe') updatePipeWorld();
        }

        function updateMainWorld() {
            updateBuffs();
            
            cameraX = player.x - canvas.width / 4;
            if (cameraX < 0) cameraX = 0;

            if (player.x + canvas.width > worldmaxX) {
                generateWorldChunk(worldmaxX, worldmaxX + canvas.width);
                worldmaxX += canvas.width;
            }

            [obstacles, treasures, collectibles, monsters, pipes, clouds].forEach(arr => {
                arr.forEach((item, index) => {
                    if (item.update) item.update(player);
                    if (item.x && item.x < cameraX - canvas.width) arr.splice(index, 1);
                });
            });

            handleCollisions();
            if (score > level * 1000) { level++; updateUI(); }
        }
        
        function generateWorldChunk(startX, endX) {
             let currentX = startX;
             while(currentX < endX) {
                const rand = Math.random();
                if(rand < 0.2) {
                    obstacles.push(new Obstacle(currentX));
                    currentX += 150 + Math.random() * 100;
                } else if (rand < 0.4) {
                    monsters.push(new Monster(currentX));
                    currentX += 200 + Math.random() * 100;
                } else if (rand < 0.7) {
                    for(let i=0; i<5; i++) collectibles.push(new Collectible(currentX + i * 40));
                    currentX += 300 + Math.random() * 100;
                } else if (rand < 0.75) {
                    treasures.push(new Treasure(currentX));
                     currentX += 100;
                } else if (rand < 0.8) {
                    pipes.push(new Pipe(currentX, true));
                    currentX += 250;
                } else {
                    currentX += 100 + Math.random() * 100;
                }
             }
        }

        function updatePipeWorld() {
            cameraX = 0;
            collectibles.forEach((c, i) => {
                if (checkCollision(player, c)) {
                    score += 20; collectibles.splice(i, 1); updateUI();
                }
            });
            const exitPipe = pipes[0];
            if (exitPipe) {
                const onTopOfPipe = Math.abs((player.y + player.height) - exitPipe.y) < 1;
                const horizontallyAligned = player.x + player.width / 2 > exitPipe.x && player.x + player.width / 2 < exitPipe.x + exitPipe.width;
                if (onTopOfPipe && horizontallyAligned && keys['ArrowDown']) {
                    exitPipeWorld();
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(-cameraX, 0);

            if (worldState === 'main') drawMainWorld();
            else if (worldState === 'pipe') drawPipeWorld();

            ctx.restore();
        }

        function drawMainWorld() {
            clouds.forEach(cloud => cloud.draw());
            ctx.fillStyle = '#475569';
            ctx.fillRect(cameraX, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            player.draw();
            [obstacles, treasures, collectibles, monsters, pipes].forEach(arr => arr.forEach(item => item.draw()));
        }

        function drawPipeWorld() {
            canvas.style.background = '#111827';
            ctx.fillStyle = '#a16207';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            player.draw();
            collectibles.forEach(c => c.draw());
            pipes.forEach(p => p.draw());
        }

        function handleDamage() {
             if (player.buffs.shield) {
                player.buffs.shield = false;
                const shieldBuff = activeBuffs.find(b => b.type === 'shield');
                if(shieldBuff) shieldBuff.timer = 0;
                updateUI();
                return;
            }
            lives--;
            updateUI();
            damageFlash.style.opacity = '0.7';
            setTimeout(() => { damageFlash.style.opacity = '0'; }, 150);

            if (lives <= 0) {
                gameOver();
            }
        }

        function handleCollisions() {
            obstacles.forEach((obs, index) => {
                if (checkCollision(player, obs)) {
                    handleDamage(); obstacles.splice(index, 1);
                }
            });
            treasures.forEach((t, index) => {
                if (checkCollision(player, t)) { pauseGameForQuestion(t); treasures.splice(index, 1); }
            });
            collectibles.forEach((c, index) => {
                if (checkCollision(player, c)) { score += 10; collectibles.splice(index, 1); updateUI(); }
            });
            monsters.forEach((m, index) => {
                if(checkCollision(player, m)) {
                    const isStomp = player.velocityY > 0 && (player.y + player.height) < (m.y + 20);
                    if (isStomp) {
                        monsters.splice(index, 1); score += 50; player.velocityY = -8;
                    } else {
                        handleDamage(); monsters.splice(index, 1);
                    }
                }
            });
        }
        
        function enterPipeWorld(pipe) {
            worldState = 'pipe';
            player.returnX = pipe.x;
            obstacles = []; treasures = []; monsters = []; pipes = []; collectibles = [];
            for(let i=0; i<3; i++) for(let j=0; j<8; j++) collectibles.push(new Collectible(150 + j * 60, GROUND_Y - 40 - i * 50));
            const exitPipe = new Pipe(canvas.width - 100, false);
            exitPipe.isExit = true;
            pipes.push(exitPipe);
            player.x = 50; player.y = GROUND_Y - player.height;
            player.velocityX = 0;
        }

        function exitPipeWorld() {
            worldState = 'main';
            canvas.style.background = 'linear-gradient(to bottom, #87CEEB, #B2FFFF)';
            player.x = player.returnX;
            pipes = []; collectibles = [];
            worldmaxX = player.x + canvas.width;
        }
        
        function pauseGameForQuestion(treasure) { 
            gameState = 'paused'; overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)'; problemScreen.style.display = 'block';
            generateProblem(treasure);
        }
        function resumeGame() {
            gameState = 'playing'; overlay.style.backgroundColor = 'transparent'; problemScreen.style.display = 'none';
            gameLoop();
        }
        function gameOver() {
            gameState = 'gameOver'; 
            overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.7)'; 
            startEndScreen.style.display = 'block';
            problemScreen.style.display = 'none'; // Hide problem screen on game over
            document.getElementById('character-selection').style.display = 'block'; // Show char select again
            overlayTitle.textContent = 'เกมโอเวอร์'; 
            overlayText.textContent = `คุณทำได้ ${score} คะแนน! กด Spacebar เพื่อเล่นอีกครั้ง`;
            restartButton.style.display = 'none'; // Use spacebar to restart
        }
        function updateUI() {
            levelDisplay.textContent = level; scoreDisplay.textContent = score; livesDisplay.textContent = '❤️'.repeat(lives);
            buffContainer.innerHTML = '';
            activeBuffs.forEach(buff => {
                const buffEl = document.createElement('div');
                buffEl.className = 'bg-black bg-opacity-50 p-2 rounded-lg text-2xl mb-2';
                buffEl.textContent = `${buff.icon} ${Math.ceil(buff.timer / 60)}s`;
                buffContainer.appendChild(buffEl);
            });
        }
        function checkCollision(rect1, rect2) {
             const rect1Right = rect1.x + rect1.width; const rect2Right = rect2.x + rect2.width;
             const rect1Bottom = rect1.y + rect1.height; const rect2Bottom = rect2.y + rect2.height;
             return rect1.x < rect2Right && rect1Right > rect2.x && rect1.y < rect2Bottom && rect1Bottom > rect2.y;
        }
        function generateProblem(treasure) {
            // New logic for problems with answer <= 20
            const num1 = Math.floor(Math.random() * 19) + 1; // num1 is between 1 and 19
            const maxNum2 = 20 - num1;
            const num2 = Math.floor(Math.random() * maxNum2) + 1; // num2 is between 1 and (20 - num1)
            const answer = num1 + num2;

            let choices = [answer];
            while(choices.length < 3) { let wrong = answer + Math.floor(Math.random() * 10) - 5; if(wrong !== answer && !choices.includes(wrong) && wrong > 0 && wrong <= 20) choices.push(wrong); }
            choices.sort(() => Math.random() - 0.5);
            problemDisplay.textContent = `${num1} + ${num2} = ?`; choicesContainer.innerHTML = ''; const arrowKeys = ['◀', '▲', '▶'];
            choices.forEach((choice, index) => {
                const choiceEl = document.createElement('div');
                choiceEl.className = 'bg-slate-700 p-3 rounded-lg text-xl font-bold w-24 border-2 border-transparent hover:border-cyan-400 transition-all cursor-pointer';
                choiceEl.textContent = `${arrowKeys[index]} ${choice}`;
                choiceEl.addEventListener('click', () => { if(window.answerHandler) window.answerHandler(index); });
                choicesContainer.appendChild(choiceEl);
});
            messageDisplay.textContent = '';
            window.answerHandler = (selectedIndex) => {
                if (choices[selectedIndex] === answer) { messageDisplay.textContent = "ถูกต้อง! Techno ได้รับพลังพิเศษ!"; technoTone('good'); applyRandomBuff();
                } else { messageDisplay.textContent = "พลาดนิดเดียว! วิเคราะห์แล้วลองภารกิจถัดไป"; technoTone('bad'); }
                delete window.answerHandler; setTimeout(resumeGame, 1500);
            };
        }
        function applyRandomBuff() {
            const rand = Math.random();
            if (rand < 0.1 && lives < 5) { lives++; updateUI();
            } else if (rand < 0.55) { activeBuffs.push({ type: 'shield', timer: 600, icon: '🛡️' }); player.buffs.shield = true;
            } else { activeBuffs.push({ type: 'magnet', timer: 900, icon: '🧲' }); player.buffs.magnet = true; }
        }
        function updateBuffs() {
            activeBuffs.forEach((buff, index) => {
                buff.timer--; if (buff.timer <= 0) { player.buffs[buff.type] = false; activeBuffs.splice(index, 1); }
            });
            if (frameCount % 60 === 0) updateUI();
        }

        // === Event Listeners ===
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if ((gameState === 'waiting' || gameState === 'gameOver') && e.code === 'Space') {
                 // On Game Over screen, hide it and re-init
                if (gameState === 'gameOver') {
                    startEndScreen.style.display = 'none';
                    document.getElementById('character-selection').style.display = 'none';
                }
                init();
            }
            else if (gameState === 'playing') {
                if (e.code === 'Space') { e.preventDefault(); player.jump(); }
                if (e.code === 'ArrowDown') {
                    player.isCrouching = true;
                    if (worldState === 'main') {
                        for (const pipe of pipes) {
                            const onTopOfPipe = Math.abs((player.y + player.height) - pipe.y) < 1;
                            const horizontallyAligned = player.x + player.width / 2 > pipe.x && player.x + player.width / 2 < pipe.x + pipe.width;
                            if (pipe.isEnterable && onTopOfPipe && horizontallyAligned) {
                                enterPipeWorld(pipe); 
                                break;
                            }
                        }
                    }
                }
            } else if (gameState === 'paused' && window.answerHandler) {
                 if (e.code === 'ArrowLeft') window.answerHandler(0);
                 else if (e.code === 'ArrowUp') window.answerHandler(1);
                 else if (e.code === 'ArrowRight') window.answerHandler(2);
            }
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'ArrowDown') player.isCrouching = false;
        });
        
        restartButton.addEventListener('click', () => {
             startEndScreen.style.display = 'none';
             document.getElementById('character-selection').style.display = 'none';
             init();
        });
    </script>
<div class="techno-controls" aria-label="ตัวควบคุมเกมบนมือถือ">
  <button data-key="ArrowLeft" aria-label="เดินซ้าย">◀</button><button data-key="ArrowDown" aria-label="ย่อตัวหรือเข้าท่อ">▼</button><button id="techno-start" aria-label="เริ่มเกม">START</button><button id="techno-jump" aria-label="กระโดด">JUMP</button><button data-key="ArrowRight" aria-label="เดินขวา">▶</button>
</div>
<button id="sound-toggle" class="sound-toggle" aria-pressed="false">🔇 เสียง</button>
<script>
(() => {
  const start=()=>{ if(gameState==='waiting'||gameState==='gameOver'){ startEndScreen.style.display='none'; init(); technoTone('click'); } };
  document.getElementById('techno-start').addEventListener('click',start);
  restartButton.addEventListener('click',start);
  document.getElementById('techno-jump').addEventListener('pointerdown',e=>{e.preventDefault(); if(gameState==='playing') player.jump();});
  document.querySelectorAll('[data-key]').forEach(b=>{ const k=b.dataset.key; const on=e=>{e.preventDefault();keys[k]=true;if(k==='ArrowDown'&&player)player.isCrouching=true}; const off=e=>{e.preventDefault();keys[k]=false;if(k==='ArrowDown'&&player)player.isCrouching=false}; b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off); });
  document.getElementById('sound-toggle').addEventListener('click',e=>{soundEnabled=!soundEnabled;e.currentTarget.textContent=soundEnabled?'🔊 เสียง':'🔇 เสียง';e.currentTarget.setAttribute('aria-pressed',soundEnabled);technoTone('click');});
})();
</script>
