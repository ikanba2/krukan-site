<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><title>ตรวจภาพประกอบ Techno Talk / Aksorn</title>
<style>body{margin:0;background:#fff;font:14px Tahoma,sans-serif}h2{margin:12px}#out{display:flex;flex-wrap:wrap;gap:6px;padding:8px}.t{width:150px;text-align:center}.t canvas{border:1px solid #ccd;border-radius:8px;background:#fffdf2}.t div{font-size:13px;line-height:1.2}.t small{color:#888}</style></head>
<body><h2 id="h">กำลังโหลด…</h2><div id="out"></div>
<script>
/* หน้าเครื่องมือสำหรับตรวจภาพประกอบ (ไม่ใช่ส่วนของเกม): วาดภาพทุกคำของ Techno Aksorn และ Techno Talk พร้อมชื่อคำ
   เปิด http://localhost:8800/tools/games/_art_audit.html · window.__sheet() คืน dataURL ของภาพรวมทั้งหมด */
(async function () {
  // สองเกมประกาศชื่อตัวแปรซ้ำกัน (LEVELS ฯลฯ) จึงโหลดแยกกัน แล้วรวมผล
  const load = async (files, ret) => { const src = (await Promise.all(files.map(f => fetch(f + '?v=' + Date.now()).then(r => r.text())))).join('\n;\n'); return new Function('KG', src + '\nreturn ' + ret + ';')({ tex() { }, rnd: Math.random }); };
  const ART = ['talk/art-kid.js', 'talk/art-things.js', 'talk/art-scene.js'];
  const A = await load(ART.concat(['aksorn/art-thai.js', 'aksorn/thai-data.js', 'aksorn/thai-color.js', 'aksorn/trace-data.js', 'aksorn/engine.js', 'aksorn/thai-r2.js']), '{ drawSpec, CONS, VOWELS, R2 }');
  const T = await load(ART.concat(['talk/content.js']), '{ WORDS }');
  const X = Object.assign({}, A, { WORDS: T.WORDS });
  const items = [];
  X.CONS.forEach(r => items.push(['พยัญชนะ', r[0] + ' ' + r[2], r[4]]));
  X.VOWELS.forEach(r => { if (r[7]) items.push(['สระ', r[1] + ' ' + r[6], r[7]]); });
  Object.keys(X.R2.WORDS).forEach(w => items.push(['คำ R2', w, X.R2.WORDS[w]]));
  Object.values(X.R2.SENT).forEach(s => items.push(['ประโยค', s.text, s.pic]));
  Object.keys(X.WORDS).forEach(k => items.push(['Talk', X.WORDS[k][0] + ' = ' + X.WORDS[k][1], X.WORDS[k][2]]));
  const out = document.getElementById('out'), S = 150;
  items.forEach(([g, label, spec]) => {
    const d = document.createElement('div'); d.className = 't'; const c = document.createElement('canvas'); c.width = S; c.height = S;
    try { X.drawSpec(c.getContext('2d'), spec, S, S); } catch (e) { const g2 = c.getContext('2d'); g2.fillStyle = 'red'; g2.fillText('ERR ' + e.message, 4, 20); }
    d.appendChild(c); const l = document.createElement('div'); l.innerHTML = label + '<br><small>' + g + ' · ' + (spec ? (spec.k + ':' + (spec.id || '')) : '-') + '</small>'; d.appendChild(l); out.appendChild(d);
  });
  document.getElementById('h').textContent = 'ภาพทั้งหมด ' + items.length + ' ภาพ';
  window.__items = items.map(i => [i[0], i[1], i[2] && i[2].k, i[2] && i[2].id]);
  // ภาพรวมเป็นแผ่นเดียว (ไว้ส่งเข้าเซิร์ฟเวอร์รับภาพ) ช่วงที่ from ถึง to
  window.__sheet = (from, to, cols) => {
    const list = items.slice(from || 0, to || items.length), C = cols || 10, W = 160, H = 190, cv = document.createElement('canvas'); cv.width = C * W; cv.height = Math.ceil(list.length / C) * H; const g = cv.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.font = '14px Tahoma'; g.textAlign = 'center';
    list.forEach(([grp, label, spec], i) => { const x = (i % C) * W, y = Math.floor(i / C) * H, c = document.createElement('canvas'); c.width = 150; c.height = 150; try { X.drawSpec(c.getContext('2d'), spec, 150, 150); } catch (e) { } g.fillStyle = '#fffdf2'; g.fillRect(x + 5, y + 5, 150, 150); g.drawImage(c, x + 5, y + 5); g.fillStyle = '#222'; g.fillText(label.slice(0, 22), x + W / 2, y + 172); g.fillStyle = '#999'; g.fillText((from || 0) + i + ' ' + grp, x + W / 2, y + 187); });
    return cv.toDataURL('image/png');
  };
})();
</script></body></html>
